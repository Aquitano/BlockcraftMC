name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: blockcraft-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BLOCKCRAFT_TEST_DB_PORT: 3306
      BLOCKCRAFT_TEST_DB_PASSWORD: blockcraft-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            paper/*/build/libs/*.jar
            velocity/*/build/libs/*.jar
            !**/*-slim.jar
