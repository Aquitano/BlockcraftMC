[versions]
java = "25"
minecraft = "26.3"
paper-api = "26.3.build.206-stable"
velocity-api = "4.2.0"
velocity-build = "30"
hikaricp = "7.1.0"
mariadb-client = "3.5.10"
run-task = "3.1.0"
shadow = "9.6.1"
adventure = "5.2.0"
snakeyaml = "2.2"
slf4j = "2.0.18"
luckperms = "5.5"
viaversion = "5.12.1"
grimac = "2.3.75-1299a2a"

[libraries]
junit = { module = "junit:junit", version = "4.13.2" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mariadb-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-client" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

# Gradle plugins consumed by buildSrc convention plugins
run-task = { module = "xyz.jpenilla:run-task", version.ref = "run-task" }
shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
