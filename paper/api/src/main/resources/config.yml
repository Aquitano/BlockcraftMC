database:
  host: localhost
  port: 3306
  database: blockcraft
  username: blockcraft
  password: blockcraft

# Network addresses; every message of every Paper plugin can use them as <ip>, <website>, <shop>, <teamspeak>
# and <discord>. Keep them in step with the proxy's network section.
network:
  ip: BlockcraftMC.net
  website: https://BlockcraftMC.net
  shop: https://shop.BlockcraftMC.net
  teamspeak: ts.BlockcraftMC.net
  discord: https://discord.gg/kh3xaQ3

# The map this server runs, as a directory outside the server (README, "Maps"). When set, the world folder is
# replaced by a copy of it at every start and /map save publishes the running world back into it. Empty keeps the
# world as it is. BLOCKCRAFT_WORLD_TEMPLATE overrides it.
world:
  template: ""

# Balance a player starts with on their first join anywhere on the network.
starting-coins: 10

# How often this server announces itself to the proxy (bc_servers).
heartbeat-seconds: 5

# The games the profile card lists: the menu key (its name is profile.games.<key> in messages.yml) and the
# stats table it reads. A game the network does not run yet simply shows zeroes.
profile:
  games:
    quicksg: qsg_stats
    emeraldrush: em_stats
    duell: duell_stats

# Network XP (bc_xp). Each level costs level-step more XP than the one before: level 2 at 100, level 3 at 300,
# level 10 at 4500. rewards are what every game hands out per kill and per win.
xp:
  level-step: 100
  rewards:
    kill: 10
    win: 50
