name: BlockcraftAPI
version: '${version}'
main: me.blockcraft.api.BlockcraftApiPlugin
bootstrapper: me.blockcraft.api.BlockcraftApiBootstrap
api-version: '${minecraft}'
author: Aquitano
description: Shared database connection and coins for the Blockcraft plugins
dependencies:
  server:
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  blockcraft.presentation:
    description: Tests the shared dialogue and presentation prototypes
    default: op
