prefix: "<primary><ip> <dark>» <reset>"

# The network's colours. Every Paper plugin's messages.yml may use these as tags, so a redesign happens here
# and nowhere else. The values are spliced in before parsing, so a colour tag colours what follows it.
palette:
  primary: "<blue>"
  accent: "<yellow>"
  muted: "<gray>"
  dark: "<dark_gray>"
  success: "<green>"
  error: "<red>"
  bullet: "<dark_gray>● "
  arrow: "<dark_gray>» "
  left: "<green>Linksklick <dark_gray>· <gray>"
  right: "<yellow>Rechtsklick <dark_gray>· <gray>"
  click: "<green>Klicken <dark_gray>· <gray>"
  quicksg: "<gold>"
  emeraldrush: "<green>"
  duell: "<aqua>"
  bedwars: "<dark_aqua>"
  mlgrush: "<light_purple>"
  premium: "<gold>"

games:
  quicksg:
    name: "<quicksg>QuickSG"
  emeraldrush:
    name: "<emeraldrush>EmeraldRush"
  duell:
    name: "<duell>Duell"
  bedwars:
    name: "<bedwars>BedWars"
  mlgrush:
    name: "<mlgrush>MLG Rush"
game-status:
  available: "<success>Jetzt spielen"
  full: "<muted>Alle Plätze belegt"
  ingame: "<muted>Runde läuft"
  restart: "<accent>Startet neu"
  offline: "<muted>Gerade offline"

commands:
  coins:
    description: "Zeigt deine Coins, mit /coins top die zehn reichsten Spieler"
  level:
    description: "Zeigt dein Level"
  build:
    description: "Schaltet den Baumodus um"
  map:
    description: "Zeigt die Map oder speichert sie mit /map save"
  afk:
    description: "Meldet dich als abwesend oder zurück"

# What <icon:name> draws for a client without the network resource pack; with it, the pack's own glyph.
icons:
  profile: "☻"
  coins: "◎"
  level: "★"
  chat: "✉"
  server: "▤"
  players: "☻"
  map: "◈"
  kit: "⚒"
  spectator: "◉"
  time: "⌛"
  emerald: "◆"
  winner: "♛"
  mode: "⚑"
  opponent: "⚔"
  kills: "☠"

tab:
  default-prefix: "<muted>"
  vanished-suffix: " <dark>[<muted>V<dark>]"
  afk-suffix: " <dark>[<muted>AFK<dark>]"

afk:
  status: "<muted>Du bist <accent>AFK<muted>. Beweg dich, um zurückzukommen."
  back:
    - "<success>Willkommen zurück! <muted>Du warst <accent><minutes> Minuten <muted>weg."
    - "<success>Wieder da! <accent><minutes> Minuten <muted>Pause. Dein Platz ist noch warm."
    - "<success>Willkommen zurück! <accent><minutes> Minuten <muted>weg. Die Blöcke stehen noch."
  poked: "<prefix><primary><player> <muted>hat <count> versucht, dich zu wecken."
  poke-count:
    1: "einmal"
    2: "zweimal"
    3: "dreimal"
    many: "<amount>-mal"

menu:
  load:
    title: "<arrow><primary>Wird geladen"
    pending: "<muted>Einen Moment …"
    failed: "<arrow><error>Laden fehlgeschlagen"
    retry: "<accent>Erneut versuchen"
  filler: " "
  back: "<arrow><error>Zurück"
  close: "<arrow><error>Schließen"
  cancel: "<error>Abbrechen"
  previous: "<primary>Vorherige Seite"
  next: "<primary>Nächste Seite"
  page: "<muted>Seite <page> von <pages>"
  refresh: "<primary>Aktualisieren"
  empty: "<muted>Hier ist noch nichts."
  confirm:
    unavailable: "<arrow><error>Kauf nicht möglich"
    title: "<arrow><primary>Bestätigen"
    accept: "<success>Kaufen"

purchase:
  completed: "<success>Kauf abgeschlossen."
  pending: "<muted>Kauf wird verarbeitet…"
  confirm-price: "<muted>Preis <dark>· <accent><coins> Coins"
  confirm-balance: "<muted>Dein Guthaben <dark>· <accent><coins> Coins"
  confirm-remaining: "<muted>Nach dem Kauf <dark>· <success><coins> Coins"
  confirm-missing: "<error>Dir fehlen <coins> Coins."
  bought: "<prefix><item> <success>für <accent><coins> Coins <success>freigeschaltet."
  balance: "<prefix><muted>Kontostand <dark>· <accent><coins> Coins"
  too-expensive: "<prefix><error>Du benötigst <accent><coins> Coins <error>um dir das zu kaufen."
  unavailable: "<error>Du kannst hier gerade nichts kaufen."

login:
  retry: "<error>Deine Daten konnten gerade nicht geladen werden. <muted>Bitte versuche es gleich noch einmal."

# The card every server shows on arrival; <where> is the lobby or the game, <map> and <builders> come from the
# map's map.yml.
arrival:
  title: "<primary><where>"
  subtitle: "<muted>Map <accent><map>"
  subtitle-credits: "<muted>Map <accent><map> <muted>von <accent><builders>"

# The moments every game shares, said the same way everywhere.
arena:
  cancelled: "<prefix><muted>Zu wenige Spieler, der Countdown wurde abgebrochen."
  started: "<prefix><muted>Die Runde wurde gestartet."
  joined: "<prefix><white><player> <muted>hat das Spiel betreten! <dark>[<accent><online><dark>/<accent><max><dark>]"
  left: "<prefix><white><player> <muted>hat das Spiel verlassen! <dark>[<accent><online><dark>/<accent><max><dark>]"
  starting-in: "<prefix><muted>Die Runde startet in <accent><seconds> <muted>Sekunden."
  restart-in: "<prefix><muted>Der Server startet in <error><seconds> <muted>Sekunden neu!"
  spectating: "<prefix><muted>Du schaust <accent><player> <muted>beim Spielen zu."
  spectator-chat: "<dark>[<muted>Zuschauer<dark>]"
  watching: "<muted>Du schaust <accent><player> <muted>zu."
  tracker:
    - " "
    - "<prefix><muted><minutes> Minuten sind vorbei, alle Spieler bekommen einen Tracker!"
    - " "
  ends-in-minutes: "<prefix><error>Das Spiel endet in <minutes> Minuten!"
  ends-in-minute: "<prefix><error>Das Spiel endet in 1 Minute!"

# The hotbar and player picker of a spectator, who watches flying and unseen.
spectator:
  pick: "<arrow><primary>Spieler wählen"
  previous: "<arrow><primary>Vorheriger Spieler"
  next: "<arrow><primary>Nächster Spieler"
  leave: "<arrow><primary>Zur Lobby"
  nobody: "<muted>Gerade spielt niemand, dem du zuschauen kannst."
  menu:
    title: "<arrow><primary>Zuschauen"
    player: "<accent><player>"
    player-lore: "<bullet><click>Zu <player> fliegen"

# The shared countdown: the last seconds as a title, then the start.
countdown:
  waiting: "<muted>Warten auf Spieler <dark>● <accent>Noch <players> benötigt"
  starting: "<muted>Rundenstart in <accent><seconds>s"
  seconds: "<primary><seconds>"
  go: "<success><bold>LOS!"

build:
  enabled: "<prefix><success>Baumodus aktiviert. <muted>Speichere die Map mit <accent>/map save<muted>, sonst ist sie beim Neustart wieder wie vorher."
  disabled: "<prefix><error>Baumodus deaktiviert."

# The staff notice for the actions in config.yml's audit.notify; <action> is the action's label below.
audit:
  notice: "<prefix><accent><issuer> <dark>» <primary><action><target><detail> <dark>[<muted><server><dark>]"
  notice-target: " <muted>an <accent><target>"
  notice-detail: " <dark>(<muted><detail><dark>)"
  buttons:
    goto: "<dark>[<primary>Goto<dark>]"
    goto-hover: "<muted>Bringt dich auf den Server von <accent><player>"
    whois: "<dark>[<accent>Whois<dark>]"
    whois-hover: "<muted>Zeigt <primary>/whois <player>"
  # One label per action key; a key without one shows as it is.
  labels:
    "back": "Zurückteleportiert"
    "build.on": "Baumodus an"
    "build.off": "Baumodus aus"
    "clear": "Inventar geleert"
    "coins.give": "Coins gegeben"
    "coins.take": "Coins abgezogen"
    "coins.set": "Coins gesetzt"
    "fly.on": "Flugmodus an"
    "fly.off": "Flugmodus aus"
    "food": "Hunger gestillt"
    "freeze.on": "Eingefroren"
    "freeze.off": "Aufgetaut"
    "gamemode.survival": "Spielmodus Überleben"
    "gamemode.creative": "Spielmodus Kreativ"
    "gamemode.adventure": "Spielmodus Abenteuer"
    "gamemode.spectator": "Spielmodus Zuschauer"
    "heal": "Geheilt"
    "invsee.read": "Inventar angesehen"
    "invsee.edit": "Inventar bearbeitet"
    "kill": "Getötet"
    "kill.entities": "Entities entfernt"
    "nick.on": "Nick an"
    "nick.off": "Nick aus"
    "speed": "Geschwindigkeit gesetzt"
    "staff.on": "Staff-Modus an"
    "staff.off": "Staff-Modus aus"
    "sudo": "Als Spieler ausgeführt"
    "tp": "Spieler teleportiert"
    "tp.to": "Selbst teleportiert"
    "tpall": "Alle hergeholt"
    "tphere": "Hergeholt"
    "vanish.on": "Vanish an"
    "vanish.off": "Vanish aus"

map:
