# The ranked ladder's skill groups, keyed like elo.groups in config.yml; like the chat tags, each wears its own colour.
elo:
  groups:
    bronze: "<red>Bronze"
    silber: "<white>Silber"
    gold: "<gold>Gold"
    diamant: "<aqua>Diamant"
    meister: "<light_purple>Meister"

# The title a killed player sees: what the kill cost them, then who beat them and the health that one had left.
defeat:
  out: "<error>Ausgeschieden"
  life: "<accent>Ein Leben weniger"
  point: "<accent>Punkt verloren"
  respawn: "<accent>Getötet"
  subtitle: "<white><killer> <muted>hatte noch <error><hearts> ❤"

# A player's nemesis (Erzfeind); <won>:<lost> is the score between them from the player's side.
nemesis:
  present: "<prefix><muted>Dein Erzfeind <error><nemesis> <muted>ist in dieser Runde. Stand <accent><won>:<lost><muted>."
  revenge-title: "<success>Rache!"
  revenge-subtitle: "<white><nemesis> <muted>besiegt <dark>· <muted>Stand <accent><won>:<lost>"

# The round's answer to the F written after a death; <deceased> is the player who died.
respect:
  one: "<prefix><white><player> <muted>zollt <white><deceased> <muted>Respekt."
  many: "<prefix><accent><count> Spieler <muted>zollen <white><deceased> <muted>Respekt."

# The button a killed player gets when they call their killer a cheater.
hacker:
  report: "<prefix><error>[<killer> melden]"
  report-hover: "<muted>Klicke, um <white><killer> <muted>dem Team zu melden."

death-lines:
  generic:
    - "<prefix><white><player> <muted>ist gestorben."
    - "<prefix><white><player> <muted>braucht einen neuen Versuch."
  fall:
    - "<prefix><white><player> <muted>hat die Schwerkraft unterschätzt."
    - "<prefix><white><player> <muted>hat den Boden zu früh gefunden."
  void:
    - "<prefix><white><player> <muted>fiel ins Leere."
    - "<prefix><white><player> <muted>suchte eine Abkürzung unter der Map."
  lava:
    - "<prefix><white><player> <muted>wollte schwimmen. In Lava."
    - "<prefix><white><player> <muted>hat die heiße Quelle falsch verstanden."
  fire:
    - "<prefix><white><player> <muted>hat sich zu warm angezogen."
    - "<prefix><white><player> <muted>stand leider selbst auf dem Grill."
  drowning:
    - "<prefix><white><player> <muted>hat die Luft angehalten. Zu lange."
    - "<prefix><white><player> <muted>hat vergessen, dass hier keine Kiemen wachsen."
  explosion:
    - "<prefix><white><player> <muted>stand im Kleingedruckten der Explosion."
    - "<prefix><white><player> <muted>war der Sprengung einen Schritt zu nah."
  bow:
    - "<prefix><white><player> <muted>wurde von <white><killer> <muted>aus <accent><distance> Blöcken <muted>getroffen."
    - "<prefix><white><killer> <muted>hat <white><player> <muted>aus <accent><distance> Blöcken <muted>einen Pfeil zugestellt."
  melee:
    - "<prefix><white><player> <muted>wurde von <white><killer> <muted>besiegt."
    - "<prefix><white><killer> <muted>hat das letzte Wort gegen <white><player><muted>."
  assisted: " <white><killer> <muted>hat nachgeholfen."
  weapon: " <muted>Mit <weapon><muted>."
  weapons:
    wooden_sword: "einem Holzschwert"
    wooden_axe: "einer Holzaxt"
    fishing_rod: "einer Angel"
    stick: "einem Stock"

# The recap line of each moment a round grants, named like its achievement.
moments:
  rache: "<arrow><success>Rache <dark>· <muted>Erzfeind <white><nemesis> <muted>besiegt, Stand <accent><won>:<lost>"
  haarscharf: "<arrow><success>Haarscharf <dark>· <muted>Gewonnen mit einem halben Herzen"
  nackt: "<arrow><success>Nackt <dark>· <muted>Gewonnen ganz ohne Rüstung"
