    kills-10:
      name: "Kämpfer"
      description: "Erziele 10 Kills in EmeraldRush."
    kills-100:
      name: "Krieger"
      description: "Erziele 100 Kills in EmeraldRush."
    kills-1000:
      name: "Legende"
      description: "Erziele 1.000 Kills in EmeraldRush."
    wins-10:
      name: "Champion"
      description: "Gewinne 10 Runden EmeraldRush."
    wins-100:
      name: "Meister"
      description: "Gewinne 100 Runden EmeraldRush."
  duell:
    first-win:
      name: "Erster Sieg"
      description: "Gewinne dein erstes Duell."
    kills-10:
      name: "Kämpfer"
      description: "Erziele 10 Kills im Duell."
    kills-100:
      name: "Krieger"
      description: "Erziele 100 Kills im Duell."
    kills-1000:
      name: "Legende"
      description: "Erziele 1.000 Kills im Duell."
    wins-10:
      name: "Champion"
      description: "Gewinne 10 Duelle."
    wins-100:
