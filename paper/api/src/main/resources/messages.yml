prefix: "<primary><ip> <dark>» <reset>"

# The network's colours. Every Paper plugin's messages.yml may use these as tags, so a redesign happens here
# and nowhere else. The values are spliced in before parsing, so a colour tag colours what follows it.
palette:
  primary: "<blue>"
  accent: "<yellow>"
  muted: "<gray>"
  dark: "<dark_gray>"
  success: "<green>"
  error: "<red>"
  bullet: "<dark_gray>● "
  arrow: "<dark_gray>» "
  quicksg: "<gold>"
  emeraldrush: "<green>"
  duell: "<aqua>"
  premium: "<gold>"

games:
  quicksg:
    name: "<quicksg>QuickSG"
  emeraldrush:
    name: "<emeraldrush>EmeraldRush"
  duell:
    name: "<duell>Duell"
game-status:
  available: "<success>Jetzt spielen"
  full: "<muted>Alle Plätze belegt"
  ingame: "<muted>Runde läuft"
  restart: "<accent>Startet neu"
  offline: "<muted>Gerade offline"

commands:
  coins:
    description: "Zeigt deine Coins, mit /coins top die zehn reichsten Spieler"
  level:
    description: "Zeigt dein Level"
  build:
    description: "Schaltet den Baumodus um"
  map:
    description: "Zeigt die Map oder speichert sie mit /map save"
  afk:
    description: "Meldet dich als abwesend oder zurück"

# What <icon:name> draws for a client without the network resource pack; with it, the pack's own glyph.
icons:
  profile: "☻"
  coins: "◎"
  level: "★"
  chat: "✉"
  server: "▤"
  players: "☻"
  map: "◈"
  kit: "⚒"
  spectator: "◉"
  time: "⌛"
  emerald: "◆"
  winner: "♛"
  mode: "⚑"
  opponent: "⚔"
  kills: "☠"

tab:
  default-prefix: "<muted>"
  vanished-suffix: " <dark>[<muted>V<dark>]"
  afk-suffix: " <dark>[<muted>AFK<dark>]"

afk:
  status: "<muted>Du bist <accent>AFK<muted>. Beweg dich, um zurückzukommen."
  back: "<success>Willkommen zurück!"

menu:
  load:
    title: "<primary>Wird geladen"
    pending: "<muted>Einen Moment …"
    failed: "<error>Laden fehlgeschlagen"
    retry: "<accent>Erneut versuchen"
  filler: " "
  back: "<arrow><error>Zurück"
  close: "<arrow><error>Schließen"
  confirm:
    unavailable: "<error>Kauf nicht möglich"
    title: "<arrow><primary>Bestätigen"
    accept: "<success>Kaufen"
    cancel: "<error>Abbrechen"

login:
  retry: "<error>Deine Daten konnten gerade nicht geladen werden. <muted>Bitte versuche es gleich noch einmal."

# The card every server shows on arrival; <where> is the lobby or the game, <map> and <builders> come from the
# map's map.yml.
arrival:
  title: "<primary><where>"
  subtitle: "<muted>Map <accent><map>"
  subtitle-credits: "<muted>Map <accent><map> <muted>von <accent><builders>"

# The moments every game shares, said the same way everywhere.
arena:
  joined: "<prefix><white><player> <muted>hat das Spiel betreten! <dark>[<accent><online><dark>/<accent><max><dark>]"
  left: "<prefix><white><player> <muted>hat das Spiel verlassen! <dark>[<accent><online><dark>/<accent><max><dark>]"
  starting-in: "<prefix><muted>Die Runde startet in <accent><seconds> <muted>Sekunden."
  restart-in: "<prefix><muted>Der Server startet in <error><seconds> <muted>Sekunden neu!"
  spectating: "<prefix><muted>Du schaust <accent><player> <muted>beim Spielen zu."
  spectator-chat: "<dark>[<muted>Zuschauer<dark>]"
  tracker:
    - " "
    - "<prefix><muted><minutes> Minuten sind vorbei, alle Spieler bekommen einen Tracker!"
    - " "
  ends-in-minutes: "<prefix><error>Das Spiel endet in <minutes> Minuten!"
  ends-in-minute: "<prefix><error>Das Spiel endet in 1 Minute!"

# The shared countdown: the last seconds as a title, then the start.
countdown:
  waiting: "<muted>Warten auf Spieler <dark>● <accent>Noch <players> benötigt"
  starting: "<muted>Rundenstart in <accent><seconds>s"
  seconds: "<primary><seconds>"
  go: "<success><bold>LOS!"

build:
  enabled: "<prefix><success>Baumodus aktiviert. <muted>Speichere die Map mit <accent>/map save<muted>, sonst ist sie beim Neustart wieder wie vorher."
  disabled: "<prefix><error>Baumodus deaktiviert."

# The staff notice for the actions in config.yml's audit.notify; <action> is the action's label below.
audit:
  notice: "<prefix><accent><issuer> <dark>» <primary><action><target><detail> <dark>[<muted><server><dark>]"
  notice-target: " <muted>an <accent><target>"
  notice-detail: " <dark>(<muted><detail><dark>)"
  buttons:
    goto: "<dark>[<primary>Goto<dark>]"
    goto-hover: "<muted>Bringt dich auf den Server von <accent><player>"
    whois: "<dark>[<accent>Whois<dark>]"
    whois-hover: "<muted>Zeigt <primary>/whois <player>"
  # One label per action key; a key without one shows as it is.
  labels:
    "back": "Zurückteleportiert"
    "build.on": "Baumodus an"
    "build.off": "Baumodus aus"
    "clear": "Inventar geleert"
    "coins.give": "Coins gegeben"
    "coins.take": "Coins abgezogen"
    "coins.set": "Coins gesetzt"
    "fly.on": "Flugmodus an"
    "fly.off": "Flugmodus aus"
    "food": "Hunger gestillt"
    "freeze.on": "Eingefroren"
    "freeze.off": "Aufgetaut"
    "gamemode.survival": "Spielmodus Überleben"
    "gamemode.creative": "Spielmodus Kreativ"
    "gamemode.adventure": "Spielmodus Abenteuer"
    "gamemode.spectator": "Spielmodus Zuschauer"
    "heal": "Geheilt"
    "invsee.read": "Inventar angesehen"
    "invsee.edit": "Inventar bearbeitet"
    "kill": "Getötet"
    "kill.entities": "Entities entfernt"
    "nick.on": "Nick an"
    "nick.off": "Nick aus"
    "speed": "Geschwindigkeit gesetzt"
    "staff.on": "Staff-Modus an"
    "staff.off": "Staff-Modus aus"
    "sudo": "Als Spieler ausgeführt"
    "tp": "Spieler teleportiert"
    "tp.to": "Selbst teleportiert"
    "tpall": "Alle hergeholt"
    "tphere": "Hergeholt"
    "vanish.on": "Vanish an"
    "vanish.off": "Vanish aus"

map:
  info:
    - "<arrow><primary>Map <dark>● <accent><map>"
    - "<arrow><primary>Gebaut von <dark>● <accent><builders>"
    - "<arrow><primary>Vorlage <dark>● <muted><template>"
  saved: "<prefix><success>Map <accent><map> <success>gespeichert. <muted>Jeder Neustart startet jetzt mit diesem Stand."
  no-template: "<prefix><error>Für diesen Server ist keine Map-Vorlage eingerichtet."
  failed: "<prefix><error>Die Map konnte nicht gespeichert werden, sieh in die Konsole."

# The end-of-round recap every game shows; <game> is the game's own name, <winner> the player who won it.
summary:
  rule: "<dark><strikethrough>                                        "
  game: "<arrow><primary><game>"
  winner: "<arrow><muted>Gewinner<dark>: <white><winner>"
  draw: "<arrow><muted>Unentschieden"
  kills: "<arrow><muted>Kills<dark>: <white><kills>"
  deaths: "<arrow><muted>Tode<dark>: <white><deaths>"
  streak-best: "<arrow><muted>Beste Serie<dark>: <white><streak> Kills"
  coins: "<arrow><muted>Coins<dark>: <accent>+<coins>"
  xp: "<arrow><muted>XP<dark>: <success>+<xp>"
  again: "<arrow><success>Nochmal spielen"
  again-hover: "<muted>Klicke, um in die nächste Runde zu kommen."
  lobby: "<arrow><accent>Zur Lobby"
  lobby-hover: "<muted>Klicke, um in die Lobby zurückzukehren."
  title:
    win: "<success>Sieg"
    lose: "<error>Niederlage"
    draw: "<accent>Unentschieden"
    subtitle: "<white><winner> <muted>hat gewonnen."
    subtitle-draw: "<muted>Niemand hat gewonnen."
  streak: "<prefix><accent><player> <muted>hat eine Serie von <accent><streak> Kills<muted>!"

settings:
  pack-details: "Ressourcenpaket"
  pack-retry: "Erneut laden"
  pack-refresh: "Status aktualisieren"
  pack-requested: "<prefix><muted>Das Ressourcenpaket wurde erneut angefordert."
  pack-status:
    unavailable: "<muted>Das Ressourcenpaket ist derzeit nicht verfügbar."
    offered: "<muted>Das Ressourcenpaket wartet auf deine Bestätigung."
    downloading: "<muted>Das Ressourcenpaket wird geladen."
    applied: "<success>Das Ressourcenpaket ist aktiv."
    declined: "<muted>Du hast das Ressourcenpaket abgelehnt."
    failed: "<error>Das Ressourcenpaket konnte nicht geladen werden."
  failed: "<prefix><error>Deine Einstellung konnte nicht gespeichert werden. Bitte versuche es erneut."
  effects: "Lobby-Partikel und Vorschauen"
  title: "<arrow><primary>Einstellungen"
  save: "<success>Speichern"
  saved: "<prefix><muted>Einstellungen gespeichert."
  private-messages: "<arrow><primary>Private Nachrichten"
  party-invites: "<arrow><primary>Party-Einladungen"
  friend-requests: "<arrow><primary>Freundschaftsanfragen"
  player-visibility: "<arrow><primary>Spieler sichtbar"
  sounds: "<arrow><primary>Sounds"
  auto-nick: "<arrow><primary>Automatisch nicken"
  keep-nick: "<arrow><primary>Nick in der Lobby behalten"
  report-notifications: "<arrow><primary>Report-Benachrichtigungen"

# The dialog behind the pause menu's button and the quick-actions key (G).
server-menu:
  title: "<arrow><primary>Blockcraft"
  settings: "<primary>Einstellungen"
  profile: "<primary>Profil"
  hub: "<accent>Zur Lobby"

profile:
  recap: "<accent>Letzte Runde"
  recap-lore: "<muted>Ergebnis und Belohnungen ansehen"
  title: "<arrow><primary>Profil"
  head: "<arrow><primary><player>"
  head-lore:
    - "<bullet><muted>Rang <dark>● <rank>"
    - "<bullet><muted>Level <dark>● <accent><level>"
    - "<bullet><muted>Noch <accent><missing> <muted>XP bis Level <accent><next>"
    - "<bullet><muted>Coins <dark>● <accent><coins>"
  stats-lore:
    - "<bullet><muted>Kills <dark>● <accent><kills>"
    - "<bullet><muted>Tode <dark>● <accent><deaths>"
    - "<bullet><muted>K/D <dark>● <accent><kdr>"
    - "<bullet><muted>Siege <dark>● <accent><wins>"
  settings: "<arrow><primary>Einstellungen"
  settings-lore: "<bullet><muted>Nachrichten, Sounds und mehr"
  cosmetics: "<arrow><primary>Kosmetik"
  cosmetics-lore: "<bullet><muted>Effekte, Gadgets und Tags"
  hub: "<arrow><accent>Zur Lobby"
  hub-lore: "<bullet><muted>Zurück in die Lobby"
  achievements: "<arrow><primary>Erfolge"
  achievements-lore: "<bullet><muted><unlocked><dark>/<muted><total> freigeschaltet"
  games:
    quicksg: "<arrow><primary>QuickSG"
    emeraldrush: "<arrow><primary>EmeraldRush"
    duell: "<arrow><primary>Duell"

coins:
  self: "<prefix><muted>Du hast <accent><coins> <muted>Coins!"
  other: "<prefix><accent><player> <muted>hat <accent><coins> <muted>Coins."
  usage: "<prefix><muted>Verwende <error>/coins give|take|set \\<Spieler> \\<Anzahl> <muted>oder <error>/coins top"
  unknown: "<prefix><error><player> <muted>war noch nie auf dem Netzwerk."
  given: "<prefix><muted>Du hast <accent><player> <accent><amount> <muted>Coins gegeben. Neuer Stand: <accent><coins> <muted>Coins."
  taken: "<prefix><muted>Du hast <accent><player> <accent><amount> <muted>Coins abgezogen. Neuer Stand: <accent><coins> <muted>Coins."
  not-enough: "<prefix><error><player> <muted>hat nur <accent><coins> <muted>Coins, es wurde nichts abgezogen."
  set: "<prefix><accent><player> <muted>hat jetzt <accent><coins> <muted>Coins."
  top:
    separator: "<muted><strikethrough>---------------------------------"
    title: "<arrow><primary>Top 10 <muted>nach Coins"
    empty: "<muted>Noch niemand hat Coins gesammelt."
    first: "<accent><bold>#1 <reset><primary><name><muted> ( <white><coins><muted> Coins )"
    entry: "<reset>#<rank> <primary><name> <muted>( <white><coins><muted> Coins )"
xp:
  gained: "<success>+<amount> XP"
  level-up: "<prefix><muted>Du bist jetzt <accent>Level <level><muted>!"
level:
  self: "<prefix><muted>Du bist <accent>Level <level> <muted>und hast <accent><xp><muted>/<accent><next> <muted>XP bis zum nächsten Level."
  other: "<prefix><accent><player> <muted>ist <accent>Level <level> <muted>mit <accent><xp> <muted>XP."
tags:
  pro: "<dark>[<gold>PRO<dark>]"
  legend: "<dark>[<light_purple>LEGENDE<dark>]"
  gg: "<dark>[<success>GG<dark>]"
  og: "<dark>[<accent>OG<dark>]"
  king: "<dark>[<gold>KÖNIG<dark>]"
  noob: "<dark>[<muted>NOOB<dark>]"
  sweat: "<dark>[<aqua>SWEAT<dark>]"
  chill: "<dark>[<primary>CHILL<dark>]"

operation:
  pending: "<prefix><muted>Deine letzte Anfrage wird noch bearbeitet."
  unconfirmed: "<prefix><error>Die Anfrage konnte nicht bestätigt werden. Prüfe das Ergebnis, bevor du es erneut versuchst."
  failed: "<prefix><error>Die Daten konnten nicht geladen oder gespeichert werden. Bitte versuche es später erneut."

