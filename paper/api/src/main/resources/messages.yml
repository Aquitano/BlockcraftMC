prefix: "<gold>Blockcraft <dark_gray>» <reset>"

# The network's colours. Every Paper plugin's messages.yml may use these as tags, so a redesign happens here
# and nowhere else. The values are spliced in before parsing, so a colour tag colours what follows it.
palette:
  primary: "<blue>"
  accent: "<yellow>"
  muted: "<gray>"
  dark: "<dark_gray>"
  success: "<green>"
  error: "<red>"
  bullet: "<dark_gray>● "
  arrow: "<dark_gray>» "

commands:
  coins:
    description: "Zeigt deine Coins"
  level:
    description: "Zeigt dein Level"

tab:
  default-prefix: "<muted>"
  vanished-suffix: " <dark>[<muted>V<dark>]"

menu:
  filler: " "
  back: "<arrow><error>Zurück"
  close: "<arrow><error>Schließen"
  confirm:
    title: "<arrow><primary>Bestätigen"
    accept: "<success>Kaufen"
    cancel: "<error>Abbrechen"

# The shared countdown: the last seconds as a title, then the start.
countdown:
  seconds: "<primary><seconds>"
  go: "<success><bold>LOS!"

# The end-of-round recap every game shows; <game> is the game's own name, <winner> the player who won it.
summary:
  rule: "<dark><strikethrough>                                        "
  game: "<arrow><primary><game>"
  winner: "<arrow><muted>Gewinner<dark>: <white><winner>"
  draw: "<arrow><muted>Unentschieden"
  kills: "<arrow><muted>Kills<dark>: <white><kills>"
  deaths: "<arrow><muted>Tode<dark>: <white><deaths>"
  coins: "<arrow><muted>Coins<dark>: <accent>+<coins>"
  xp: "<arrow><muted>XP<dark>: <success>+<xp>"
  again: "<arrow><success>Nochmal spielen"
  again-hover: "<muted>Klicke, um in die nächste Runde zu kommen."
  lobby: "<arrow><accent>Zur Lobby"
  lobby-hover: "<muted>Klicke, um in die Lobby zurückzukehren."
  title:
    win: "<success>Sieg"
    lose: "<error>Niederlage"
    draw: "<accent>Unentschieden"
    subtitle: "<white><winner> <muted>hat gewonnen."
    subtitle-draw: "<muted>Niemand hat gewonnen."

settings:
  title: "<arrow><primary>Einstellungen"
  save: "<success>Speichern"
  saved: "<prefix><muted>Einstellungen gespeichert."
  private-messages: "<arrow><primary>Private Nachrichten"
  party-invites: "<arrow><primary>Party-Einladungen"
  friend-requests: "<arrow><primary>Freundschaftsanfragen"
  player-visibility: "<arrow><primary>Spieler sichtbar"
  sounds: "<arrow><primary>Sounds"

# The dialog behind the pause menu's button and the quick-actions key (G).
server-menu:
  title: "<arrow><primary>Blockcraft"
  settings: "<primary>Einstellungen"
  profile: "<primary>Profil"
  hub: "<accent>Zur Lobby"

profile:
  title: "<arrow><primary>Profil"
  head: "<arrow><primary><player>"
  head-lore:
    - "<bullet><muted>Rang <dark>● <rank>"
    - "<bullet><muted>Level <dark>● <accent><level>"
    - "<bullet><muted>Noch <accent><missing> <muted>XP bis Level <accent><next>"
    - "<bullet><muted>Coins <dark>● <accent><coins>"
  stats-lore:
    - "<bullet><muted>Kills <dark>● <accent><kills>"
    - "<bullet><muted>Tode <dark>● <accent><deaths>"
    - "<bullet><muted>K/D <dark>● <accent><kdr>"
    - "<bullet><muted>Siege <dark>● <accent><wins>"
  settings: "<arrow><primary>Einstellungen"
  settings-lore: "<bullet><muted>Nachrichten, Sounds und mehr"
  cosmetics: "<arrow><primary>Kosmetik"
  cosmetics-lore: "<bullet><muted>Effekte, Gadgets und Tags"
  games:
    quicksg: "<arrow><primary>QuickSG"
    emeraldrush: "<arrow><primary>EmeraldRush"
    duell: "<arrow><primary>Duell"

coins:
  self: "<prefix><muted>Du hast <accent><coins> <muted>Coins!"
  other: "<prefix><accent><player> <muted>hat <accent><coins> <muted>Coins."
xp:
  gained: "<success>+<amount> XP"
  level-up: "<prefix><muted>Du bist jetzt <accent>Level <level><muted>!"
level:
  self: "<prefix><muted>Du bist <accent>Level <level> <muted>und hast <accent><xp><muted>/<accent><next> <muted>XP bis zum nächsten Level."
  other: "<prefix><accent><player> <muted>ist <accent>Level <level> <muted>mit <accent><xp> <muted>XP."
tags:
  pro: "<dark>[<gold>PRO<dark>]"
  legend: "<dark>[<light_purple>LEGENDE<dark>]"
  gg: "<dark>[<success>GG<dark>]"
  og: "<dark>[<accent>OG<dark>]"
  king: "<dark>[<gold>KÖNIG<dark>]"
  noob: "<dark>[<muted>NOOB<dark>]"
  sweat: "<dark>[<aqua>SWEAT<dark>]"
  chill: "<dark>[<primary>CHILL<dark>]"
