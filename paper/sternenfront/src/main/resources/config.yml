# Two factions of players-per-team each. Whoever picks none is seated on the smaller one.
teams:
  players-per-team: 6

# The lobby counts down once players.min are there. A full lobby jumps to countdown.full seconds, /start to
# countdown.start. After countdown.round seconds the faction with more reinforcements wins, and the server restarts
# countdown.restart seconds after the round.
players:
  min: 1
debug:
  history-ticks: 100
  capture-ticks: 200
  cooldown-ticks: 200
bots:
  enabled: true
  fill-per-team: 4
  difficulty: normal
  profiles:
    easy: {reaction-ticks: 18, shot-ticks: 12, aim-spread: 0.11, burst-shots: 3, burst-pause-ticks: 30, tracking-degrees: 12, damage-scale: 0.6, headshots: false}
    normal: {reaction-ticks: 12, shot-ticks: 8, aim-spread: 0.045, burst-shots: 5, burst-pause-ticks: 12, tracking-degrees: 45, damage-scale: 0.9, headshots: false}
    veteran: {reaction-ticks: 10, shot-ticks: 8, aim-spread: 0.02, burst-shots: 0, burst-pause-ticks: 0, tracking-degrees: 180, damage-scale: 1, headshots: true}
  medic: {heal-ticks: 60, heal-amount: 3}
  sight-range: 32
  vision-angle: 120
  memory-ticks: 40
  idle-turn-degrees: 12
  step-height: 1
  kill-points: 25
appearance:
  body-turn-degrees: 12
  droids: true
  infantry: true
music:
  enabled: true
  volume: 0.35
  pressure-tickets: 35
# The look of the round and how much of it clients get. live-effects is the hard cap on short-lived models alive at
# once; every scorch.every-th wall hit leaves a mark, under their own cap, oldest first. A lit blade that reaches a
# solid block leaves a saber-mark under that same cap, one per player every cooldown-ticks: its glow thins away over
# glow-ticks, its scar stays ticks and fades over fade-ticks, tilted up to tilt-degrees off the cut's direction, scale
# blocks long. A bolt's trail drops a dot
# every trail-step blocks, and every far-every-th dot reaches players beyond 32 blocks and on reduced particle
# settings. storm.density is the
# sand grains per player every interval-ticks, storm.haze the dust specks of each of the storm's two layers every
# haze-ticks; both grow by gust-boost at the height of a gust.
presentation:
  effects: true
  holographic-posts: true
  live-effects: 64
  scorch: {marks: 32, every: 3, ticks: 300, fade-ticks: 40, scale: 0.7}
  saber-mark: {cooldown-ticks: 8, glow-ticks: 30, ticks: 300, fade-ticks: 40, scale: 1.5, tilt-degrees: 20}
  muzzle-flash: {ticks: 2, scale: 0.55, heavy-scale: 0.95}
  bolt: {width: 2.2, length: 1.6, trail-size: 1.3, trail-step: 0.75, far-every: 3, impact-flash: 0.5}
  explosion: {smoke-puffs: 3, smoke-ticks: 40, debris: 30}
  damaged: {below: 0.35, interval-ticks: 12}
  ambient: {interval-ticks: 10, range: 72}
  assault: {ticks: 100, distance: 90, height: 45, scale: 7, clearance: 0}
  storm: {density: 5, haze: 3, interval-ticks: 2, haze-ticks: 6, radius: 14, wind-speed: 0.8, gust-seconds: 7, gust-ticks: 40, gust-boost: 1.2}
combat:
  precision-hitscan: true
  damage-indicator-ticks: 30
  guard:
    capacity: 100
    recovery-per-tick: 1
    recovery-delay-ticks: 20
    break-ticks: 30
    parry-ticks: 5
    cost-per-damage: 2
  melee: {range: 3.5, angle: 85, swing-ticks: 12, targets: 2}
speeders:
  enabled: true
  health: 60
  respawn-seconds: 45
  idle-return-seconds: 45
  # Pads at each headquarters, one to three; each pad holds one single-seat craft.
  per-faction: 2
  # Blocks per tick. S brakes at braking down to a stop, then reverses at speed times reverse-share.
  speed: 0.65
  acceleration: 0.035
  braking: 0.07
  reverse-share: 0.35
  # Full turn rate from full-turn-speed upwards, standstill-turn-share of it when stopped.
  turn-degrees: 4
  standstill-turn-share: 0.15
  full-turn-speed: 0.35
  # Below this share of its health a craft shows the damaged model and trails smoke.
  damaged-share: 0.5
  # Held sprint: burns for ticks, refills in recharge-ticks, and after running dry restarts at restart-share.
  boost: {speed: 0.95, ticks: 60, recharge-ticks: 200, restart-share: 0.25}
  # Shares the rider's blaster heat. Muzzle offsets are blocks from the craft's feet along its nose and upwards.
  cannon: {damage: 4, heat: 7, cooldown-ticks: 4, speed: 4.5, range: 90, muzzle-ahead: 1.6, muzzle-height: 0.6}
  # Damage scales with speed; craft-damage is paid per target hit, each target once per cooldown.
  ram: {minimum-speed: 0.4, damage-at-top-speed: 12, craft-damage: 3, knockback: 0.9, cooldown-ticks: 20}
  explosion: {radius: 5, damage: 16}
  # Model only: pivot-height is what it banks around, tail where the wake starts behind the craft's centre.
  presentation:
    model-height: 0.15
    pivot-height: 0.4
    tail: 1.2
    bank-degrees: 18
    surge-pitch-degrees: 5
    climb-pitch-degrees: 14
    bob-height: 0.04
    bob-period-ticks: 50
    smoothing: 0.25
    teleport-ticks: 1
battlefield:
  vent: {warning-seconds: 1, seconds: 6, cooldown-seconds: 20, damage: 2}
  bulkhead: {seconds: 8, cooldown-seconds: 20}
  shutters: {seconds: 8, cooldown-seconds: 20}
countdown:
  lobby: 60
  start: 10
  full: 20
  round: 1200
  restart: 30
idle-restart-minutes: 50
timer-bar: true
global-stats-head: Kevos
# How long a running round keeps the place of a player who dropped out; 0 turns it off.
rejoin-seconds: 120

# What a kill, a captured post (to every capturer in the zone), a killed champion and a win pay in coins.
rewards:
  kill: 5
  capture: 4
  champion: 10
  hero: 15
  win: 25

# Every death costs its faction one ticket. Every bleed-seconds the faction holding more posts drains the other by
# the difference.
tickets:
  start: 150
  bleed-seconds: 5

# A round runs through three acts, which only move forward. The assault starts when the lower faction's reinforcements
# fall to assault-share of tickets.start or after assault-seconds; the last stand likewise. In the assault one post
# counts priority-bleed times when bleeding, draws the bots with priority-pull (blocks of walking they accept for it),
# and the trailing faction may land dropship-distance blocks beside it, also in the last stand. In the last stand every
# post counts last-stand-bleed times, the trailing faction's heroes cost comeback-hero-share of heroes.cost, it fields
# one more of them, and the storm shortens bots.sight-range to storm-sight-share.
acts:
  assault-share: 0.65
  assault-seconds: 360
  last-stand-share: 0.30
  last-stand-seconds: 780
  priority-bleed: 2
  priority-pull: 60
  dropship-distance: 22
  last-stand-bleed: 2
  comeback-hero-share: 0.5
  storm-sight-share: 0.6

# One player alone takes a neutral post in capture-seconds; a lead of two or three is two or three times as fast.
posts:
  capture-seconds: 12
  radio-cooldown-seconds: 15

# Tessar's secrets (EASTER_EGGS.md, "Sternenfront"). The first find of each pays coins. Brummi panics at the hits-th
# hit from one player in a round and stays away for hide-seconds. The sand beast rumbles under a player who stood
# still on its dune for rumble-seconds and breaks out after still-seconds, at scale times the model's size; then the
# dune rests for rest-seconds. A Kessel-Lauf under par-seconds finds its secret; a run ends after limit-seconds. On
# 4 May every round pays coin-factor times its coins.
secrets:
  coins: 50
  brummi: {hits: 3, hide-seconds: 30}
  sand-beast: {still-seconds: 10, rumble-seconds: 4, rest-seconds: 60, scale: 5}
  kessel: {par-seconds: 10, limit-seconds: 60}
  may-the-fourth: {coin-factor: 2}

# A dead player chooses a class and a spawn for seconds, and deploys at the headquarters after auto-seconds if they
# choose nothing. A deployed player cannot be hurt for protection-seconds or until they fire.
respawn:
  seconds: 5
  auto-seconds: 15
  protection-seconds: 3

# What an enemy inside a faction's headquarters takes every second.
headquarters:
  enemy-damage: 4

# A player who took no damage for delay-seconds heals per-second health every second.
regen:
  delay-seconds: 6
  per-second: 1

# Modern combat, so that the relic blade swings with its cooldown.
pvp:
  legacy-combat: false

# Every pull of the trigger adds the blaster's heat; full is 100. After cool-delay-ticks without a shot the gun loses
# cool-per-tick a tick. A gun at full heat vents for vent-ticks before it fires again.
heat:
  cool-delay-ticks: 8
  cool-per-tick: 3
  vent-ticks: 40

# Each class's body per faction, for players and bots: health (20 is ten hearts), speed times normal movement, scale
# times normal size. A player is 1.8 blocks tall, so 1.1 still walks the wreck's two-high corridors; a bot's body is
# 1.99 already and never grows past it, so the pathfinder keeps them too. Heroes and champions keep normal size.
classes:
  kolonien:
    soldier: {health: 20, speed: 1, scale: 1}
    heavy: {health: 30, speed: 1, scale: 1}
    scout: {health: 16, speed: 1, scale: 1}
    medic: {health: 20, speed: 1, scale: 1}
  hegemonie:
    soldier: {health: 18, speed: 1, scale: 1}
    heavy: {health: 36, speed: 0.88, scale: 1.1}
    scout: {health: 16, speed: 1, scale: 1}
    medic: {health: 18, speed: 1, scale: 1}

# Holding right click pulls the trigger every 4 ticks, so cooldown-ticks below 4 only help fast clickers. A pull fires
# bolts, burst-ticks apart; heat is per pull. speed is blocks per tick, range in blocks, spread the largest sideways
# deviation per block. A hit above the shoulders multiplies damage by headshot. Both gun heroes use the
# twin-pistol profile.
blasters:
  carbine: {damage: 4, headshot: 1.5, heat: 8, cooldown-ticks: 4, bolts: 1, burst-ticks: 0, spread: 0.012, speed: 3.5, range: 90}
  repeater: {damage: 2.5, headshot: 1.25, heat: 14, cooldown-ticks: 8, bolts: 3, burst-ticks: 2, spread: 0.05, speed: 3.5, range: 60}
  long-rifle: {damage: 11, headshot: 1.85, heat: 34, cooldown-ticks: 24, bolts: 1, burst-ticks: 0, spread: 0, speed: 5, range: 160}
  pistol: {damage: 3.5, headshot: 1.5, heat: 10, cooldown-ticks: 4, bolts: 1, burst-ticks: 0, spread: 0.015, speed: 3.5, range: 70}
  twin-pistol: {damage: 3.5, headshot: 1.6, heat: 7, cooldown-ticks: 4, bolts: 2, burst-ticks: 2, spread: 0.008, speed: 4, range: 80}
  # Separatist weapons inherit their matching Republic profile unless overridden here.
  e5: {}
  wrist-blaster: {}
  e5s: {}
  se14: {}
  westar-pistols: {}
  heavy-rifle: {damage: 6, headshot: 1.5, heat: 9, cooldown-ticks: 5, bolts: 1, burst-ticks: 0, spread: 0.01, speed: 4, range: 100}

# Each ability's cooldown and what it does. A grenade or mining charge explodes fuse-ticks after the throw and hurts enemies
# and its thrower in sight within radius, damage at its centre and a third of it at the edge. The shield wall stands
# width by height panes, distance blocks ahead, for seconds. The med station heals allies within radius for seconds.
# Siege mode roots the unit for seconds; its repeater then pulls every cooldown-ticks with bolts bolts and heat-scale of
# the heat. Two bolts every 4 ticks is a third more bolts than the normal repeater: holding right click pulls no
# faster than every 4 ticks, and three bolts would double the damage of a heavy that also has the most health.
abilities:
  grenade: {cooldown-seconds: 15, fuse-ticks: 50, radius: 5, damage: 16, throw-speed: 1.1}
  adrenaline: {cooldown-seconds: 30, seconds: 5}
  shield-wall: {cooldown-seconds: 25, seconds: 8, width: 5, height: 3, distance: 2}
  jump-pack: {cooldown-seconds: 10, forward: 1.3, up: 0.9}
  med-station: {cooldown-seconds: 25, seconds: 10, radius: 4, heal-per-second: 2}
  mining-charge: {cooldown-seconds: 25, fuse-ticks: 60, radius: 6, damage: 20, throw-speed: 0.9}
  siege-mode: {cooldown-seconds: 30, seconds: 6, cooldown-ticks: 4, bolts: 2, heat-scale: 0.5}

# The relic blade appears first-seconds into the round and again respawn-seconds after its champion falls. The
# champion has health, the blade hits for damage, and a second jump in the air or F leaps forward and up every
# leap-cooldown-seconds, with the blade in hand. Right click raises the guard.
relic:
  first-seconds: 120
  respawn-seconds: 60
  health: 40
  damage: 9
  leap-cooldown-seconds: 6
  leap-forward: 1.5
  leap-up: 0.7

# Battle points buy a hero in the deploy menu: points for a kill, for each player on a post their faction captures, and
# for each on a post that turns neutral. A hero costs cost points; each faction fields at most per-faction heroes at
# once, and each hero only once. Heroes do not heal, neither out of combat nor at a med station.
heroes:
  cost: 600
  per-faction: 1
  points:
    kill: 100
    capture: 100
    neutralise: 50
    assist: 40
    defence: 25
    healing-per-health: 2
    healing-limit-per-life: 40
    assist-window-seconds: 10
    healing-window-seconds: 20
  health:
    jedi: 60
    bounty-hunter: 50
    sith: 60
    commander: 50
  # A saber hits for damage with the sword's cooldown and ignites ignite-ticks after it is drawn. A saber hero whose
  # guard is up (hand raised by holding right click) takes blocked-share of a blade's hit. Colours are RGB hex; white
  # is for whoever found every kyber crystal, relic is the marks of the relic blade.
  saber:
    damage: 8
    blocked-share: 0.3
    ignite-ticks: 6
    hum-ticks: 40
    leap-cooldown-seconds: 5
    leap-forward: 1.4
    leap-up: 0.7
    colors: {jedi: "3D8BFF", sith: "FF2A2A", white: "F4F8FF", relic: "F4F8FF"}
  # range in blocks. force-push hits enemies within angle degrees ahead. The thrown saber flies range blocks out at
  # speed blocks per tick and back. force-grip holds for seconds and deals damage over that time. The jetpack thrusts
  # for seconds. The orbital strike falls delay-ticks after the beacon lands, blasts times within radius.
  abilities:
    force-push: {cooldown-seconds: 8, range: 7, angle: 70, strength: 1.7, up: 0.5, damage: 2}
    saber-throw: {cooldown-seconds: 10, range: 14, speed: 1.2, damage: 9}
    force-grip: {cooldown-seconds: 14, range: 14, seconds: 2, damage: 7}
    jetpack: {cooldown-seconds: 12, seconds: 4, thrust: 0.4}
    # Speed is blocks per tick. An impact hurts enemies and the owner; range exhaustion removes the rocket.
    wrist-rocket: {cooldown-seconds: 16, range: 64, speed: 1.6, radius: 3.5, damage: 18}
    # Total damage per target over ticks, with one pulse every pulse-ticks. Walls and saber guards stop it.
    force-lightning: {cooldown-seconds: 14, range: 10, angle: 50, ticks: 30, pulse-ticks: 5, targets: 3, damage: 12}
    grapple: {cooldown-seconds: 8, range: 30, speed: 2.2}
    orbital-strike: {cooldown-seconds: 30, delay-ticks: 60, radius: 5, blasts: 6, damage: 24}
    rally: {cooldown-seconds: 25, radius: 12, seconds: 6}

# A killed player watches their killer for ticks before the deploy menu opens; the wait to deploy counts meanwhile.
killcam:
  ticks: 50

# Kills in one life that earn a one-use orbital strike.
streaks:
  orbital-strike: 5

# Sneaking with the long rifle slows the walk by this share, which clients with FOV effects on show as a zoom.
scope:
  slowdown: 0.9
