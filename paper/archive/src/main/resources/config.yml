max-players: 60

# The exhibits live in directory, the template's own folder outside the map bundle (docker-compose mounts
# worlds/archive-exhibits there). An exhibit's world is copied out and loaded when the first visitor travels there,
# and dropped again once nobody has been in it for unload-after-seconds.
exhibits:
  directory: /exhibits
  unload-after-seconds: 300

# The most characters a staff note may hold.
notes:
  max-length: 256
