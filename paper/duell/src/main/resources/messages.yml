prefix: "<duell>Duell <dark>» <reset>"
game-name: "<duell>Duell"

commands:
  start:
    description: "Startet die Runde"
  setup:
    description: "Setzt die Duell-Spawns"
  forcemap:
    description: "Legt den Modus der Runde fest"
  stats:
    description: "Zeigt die Stats eines Spielers"
  top:
    description: "Zeigt die Top 10 einer Kategorie"

mode:
  vs: "1vs1"
  sg: "SurvivalGames"
  superjump: "SuperJump"
  sumo: "Sumo"

join:
  introduction: "<prefix><muted>Wähle Einzelspiel oder 3-Modi-Tour und stimm über Modus und Map ab. <duell>Ein Gegner."
  spectator: "<prefix><muted>Du bist als Zuschauer beigetreten."

# <map> is the map's name or vote.random-map; option names a vote in its confirmation.
vote:
  option: "<mode> <dark>· <accent><map>"
  random-map: "Zufällige Map"
  result: "<prefix><muted>Gespielt wird <accent><mode> <muted>auf <accent><map><muted>."
  cleared: "<prefix><muted>Deine Modus- und Map-Stimme ist zurückgenommen. Dein Format bleibt ausgewählt."

tour:
  fallback: "<prefix><muted>Für die Tour fehlen spielbare Modi. Es sind drei nötig. Ihr spielt ein Einzelspiel."
  schedule: "<prefix><muted>Eure 3-Modi-Tour: <accent><modes><muted>. Ihr spielt alle drei Spiele, auch bei 2:0."
  next: "<prefix><muted>Spiel <accent><game><muted>/<accent><total><muted>: <accent><mode> <muted>startet in <accent><seconds> Sekunden<muted>."
  game-win: "<prefix><accent><player> <muted>gewinnt das Spiel in <accent><mode><muted>."
  game-draw: "<prefix><accent><mode> <muted>endet unentschieden. Das Spiel zählt zur Tour."
  score: "<prefix><white><first> <accent><first-score> <dark>: <accent><second-score> <white><second>"
  result-note: "<muted>Deine Tourbilanz: <accent><score><muted>/<accent><games> <muted>Spiele gewonnen."
  format-chosen: "<prefix><muted>Deine Auswahl: <accent><format><muted>."
  format-single: "Einzelspiel"
  format-tour: "3-Modi-Tour"
  format-waiting: "<prefix><muted>Die Tour startet nur, wenn ihr beide die 3-Modi-Tour wählt. Bis dahin bleibt es beim Einzelspiel."
  format-request: "<prefix><accent><player> <muted>möchte eine 3-Modi-Tour. Wähle in der Abstimmung ebenfalls die Tour, um zuzustimmen."

round:
  ended: "<prefix><muted>Die Runde wurde beendet."
  draw:
    - "<prefix><muted>Die Zeit ist um. Das Duell endet <accent>unentschieden<muted>."
    - "<prefix><accent>Unentschieden. <muted>Selbst das Schwert will eine zweite Meinung."
    - "<prefix><accent>Unentschieden. <muted>Ihr habt beide den Endgegner gespielt."

# The ranked result of a round; <group> is the skill group's name from BlockcraftAPI's elo.groups.
elo:
  changed: "<prefix><muted>Elo <accent><delta> <dark>● <muted>Du stehst jetzt bei <accent><rating> <dark>(<group><dark>)<muted>."
  promoted: "<prefix><success>Aufstieg! <muted>Du spielst ab jetzt in <group><muted>."
  demoted: "<prefix><error>Abstieg. <muted>Du spielst ab jetzt in <group><muted>."

tab:
  name: "<dark>[<group><dark>] <name>"


timer:
  round: "<duell>Verbleibende Zeit <dark>● <white><time>"

superjump:
  checkpoint: "<prefix><white><player><muted> hat Checkpoint <accent><checkpoint> <muted>erreicht!"
  goal: "<prefix><white><player><muted> hat das <primary>Ziel <muted>erreicht!"

sumo:
  map-name: "Steinring"
  started: "<prefix><muted>Stoße deinen Gegner vom Ring. Wer zuerst <accent><target> Punkte <muted>hat, gewinnt."
  point: "<prefix><accent><player> <muted>erhält einen Punkt! <accent><score><muted>/<accent><target> <muted>Punkte."
  next-point: "<duell>Sumo <dark>· <muted>Nächster Punkt"

title:
  start: "<muted>Start!"
  vs-round: "<primary>Runde <round>"
  introduction: "<duell><mode> <dark>· <muted><map>"

stats:
  header: "<muted>Stats von <accent><player>"
  lines:
    - "<arrow><primary>Siege<dark>: <muted><wins>"
    - "<arrow><primary>Niederlagen<dark>: <muted><losses>"
    - "<arrow><primary>Tode<dark>: <muted><deaths>"
    - "<arrow><primary>Kills<dark>: <muted><kills>"
    - "<arrow><primary>Punkte<dark>: <muted><points>"
top:
  separator: "<muted><strikethrough>---------------------------------"
  first: "<accent><bold>#1 <reset><primary><name><muted> ( <white><value><muted> )"
  entry: "<reset>#<rank> <primary><name> <muted>( <white><value><muted> )"

item:
  vote: "<arrow><primary>Abstimmung"
  vs-kit:
    helmet: "<primary>Helm"
    chestplate: "<primary>Harnisch"
    leggings: "<primary>Hose"
    boots: "<primary>Schuhe"
    sword: "<primary>Schwert"
    rod: "<primary>Angel"
    bow: "<primary>Bogen"
    arrows: "<primary>Pfeile"

menu:
  formats:
    single: "<arrow><primary>Einzelspiel"
    single-lore:
      - "<bullet><muted>Standard: ein Spiel in einem Modus."
      - "<bullet><muted>Eure Stimmen bestimmen Modus und Map."
    tour: "<arrow><primary>3-Modi-Tour"
    tour-lore:
      - "<bullet><muted>Drei verschiedene Modi in zufälliger Reihenfolge."
      - "<bullet><muted>Alle drei Spiele werden gespielt, auch bei 2:0."
      - "<bullet><muted>Jeder nominiert über die Moduswahl einen Modus."
      - "<bullet><muted>Bis zu zwei Nominierungen, der Rest zufällig."
      - "<bullet><muted>Ohne Nominierungen: drei zufällige Modi."
      - "<bullet><muted>Eure Map-Stimmen zählen im jeweiligen Modus."
      - "<bullet><muted>Die Tour gilt nur, wenn ihr beide sie wählt."
    current: "<bullet><muted>Aktuell: <accent><format>"
    selected: "<success>Deine Auswahl"
    choose: "<left>Format wählen"
  modes:
    title: "<arrow><duell>Duell <dark>· <muted>Euer Spiel"
    vs: "<arrow><primary>1vs1"
    vs-lore: "<bullet><muted>Schwert, Bogen und Angel. Besiege deinen Gegner."
    sg: "<arrow><primary>SurvivalGames"
    sg-lore: "<bullet><muted>Sammle Beute und gewinne den letzten Kampf."
    superjump: "<arrow><primary>SuperJump"
    superjump-lore: "<bullet><muted>Erreiche die Checkpoints und das Ziel zuerst."
    sumo: "<arrow><primary>Sumo"
    sumo-lore: "<bullet><muted>Stoße deinen Gegner ohne Ausrüstung vom Ring und sammle Punkte."
    random: "<arrow><primary>Dem Zufall überlassen"
    random-lore:
      - "<bullet><muted>Nimmt deine Modus- und Map-Stimme zurück."
      - "<bullet><muted>Ohne Nominierungen ist die Tour vollständig zufällig."
      - "<left>Stimme zurücknehmen"
    mlgrush: "<arrow><mlgrush>MLG Rush"
    mlgrush-lore:
      - "<bullet><muted>Baue zum gegnerischen Bett und zerstöre es."
      - "<bullet><muted>Wechselt zu MLG Rush mit eigener Warteschlange und Stats."
      - "<left>MLG Rush spielen"
  maps:
    title: "<arrow><duell><mode> <dark>· <muted>Eure Map"
    map: "<arrow><primary><map>"
  stats:
    title: "<arrow><duell>Duell <dark>· <muted>Stats"
    player: "<accent><player>"
    player-lore:
      - "<arrow><primary>Kills<dark>: <muted><kills>"
      - "<arrow><primary>Siege<dark>: <muted><wins>"
      - "<arrow><primary>Tode<dark>: <muted><deaths>"
      - "<arrow><primary>K/D<dark>: <muted><kdr>"
      - "<arrow><primary>Liga<dark>: <group>"
      - "<arrow><primary>Elo<dark>: <muted><rating>"
    global: "<arrow><primary>Globale Stats"
  global-stats:
    title: "<arrow><duell>Duell <dark>· <muted>Globale Stats"
    wins: "<arrow><primary>Siege"
    deaths: "<arrow><primary>Tode"
    kills: "<arrow><primary>Kills"
    losses: "<arrow><primary>Niederlagen"
    points: "<arrow><primary>Punkte"

scoreboard:
  title: "<duell><bold>Duell"
  duellists: "<muted><icon:opponent> DUELLANTEN"
  spectator-player: "<primary><player>"
  spectator-kills: "<primary><player> <dark>· <duell><kills> Kills"
  spectator-points: "<primary><player> <dark>· <duell><points> Punkte"
  spectator-checkpoint: "<primary><player> <dark>· <duell>Checkpoint <checkpoint>"
  kills: "<muted><icon:kills> KILLS"
  points: "<muted><icon:kills> PUNKTE"
  mode: "<muted><icon:mode> MODUS"
  tour: "<muted><icon:mode> TOUR"
  tour-progress: "<muted>Spiel <accent><game><muted>/<accent><total>"
  tour-score: "<accent><wins> <dark>: <accent><opponent-wins>"
  mode-voting: "<muted>Abstimmung läuft"
  mode-leading: "<mode> <muted>führt"
  group-value: "<arrow><group> <dark>(<white><rating><dark>)"
  map-random: "<muted>Wird ausgewählt"
  opponent: "<muted><icon:opponent> GEGNER"
  opponent-none: "<muted>Warte auf einen Gegner"

# The rematch offered when a duel ends; <opponent> is the other duellist.
rematch:
  offer: "<arrow><duell>[Revanche]"
  offer-hover: "<muted>Klicke, um gleich noch einmal gegen <white><opponent> <muted>anzutreten."
  asked:
    - "<prefix><muted>Deine Revanche-Anfrage ist bei <white><opponent> <muted>angekommen."
    - "<prefix><muted>Revanche bei <white><opponent> <muted>angefragt. Diesmal kennst du den Endgegner."
    - "<prefix><muted>Revanche bei <white><opponent> <muted>angefragt. Das war nur die Generalprobe."
  request: "<prefix><white><player> <muted>will eine Revanche. "
  accept: "<success>[Annehmen]"
  accept-hover: "<muted>Klicke, um die Revanche gegen <white><opponent> <muted>anzunehmen."
  waiting: "<prefix><muted>Deine Anfrage steht, jetzt ist <white><opponent> <muted>am Zug."
  gone: "<prefix><muted>Dein Gegner ist schon weg, die Revanche muss warten."

mirror:
  familiar: "<prefix><muted>Den Kampfstil von <accent><opponent> <muted>kennst du schon. Willkommen zur nächsten Begegnung."
  inspection: "<prefix><muted>Zweimal unentschieden? Der Schiedsrichter verlangt eine Spiegelkontrolle. Euer Tag <dark>[<primary>SPIEGEL<dark>] <muted>wartet in den Lobby-Extras."
