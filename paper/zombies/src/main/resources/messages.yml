  yard:
    name: "Wachbuch"
    body:
      - "<muted>Tag 1. Der Konvoi ist nicht gekommen. Der Funk ist seit 04:12 Uhr tot."
      - "<muted>Tag 3. Bewegung am Waldrand. Wir haben die Fenster vernagelt. Der Kommandant sagt, es sind Plünderer."
      - "<muted>Tag 4. Plünderer stöhnen nicht."
      - "<dark>Wache Nord"
  depot:
    name: "Lieferschein"
    body:
      - "<muted>Lieferung 7. Vierzig Kisten, Inhalt medizinisch. Nicht öffnen, nur kühl lagern."
      - "<muted>Der Kühlraum ist voll, deshalb steht Kiste 23 in der Halle."
      - "<muted>Kiste 23 kratzt von innen. Wir haben sie nicht geöffnet. Jetzt ist sie offen."
      - "<dark>Lagerist M. Brandt"
  workshop:
    name: "Werkstattbuch"
    body:
      - "<muted>Der Jeep bleibt auf der Hebebühne. Ohne Ersatzteile kommt hier keiner mehr weg."
      - "<muted>Ich habe die alten Gewehre umgebaut. Sie schießen schneller und halten weniger aus. Wie wir."
      - "<muted>Sobald der Strom wieder läuft, holt die Werkbank mehr aus jeder Waffe heraus."
      - "<dark>Mechanikerin J. Albers"
  power:
    name: "Schichtprotokoll"
    body:
      - "<muted>23:40 Uhr. Generator abgeschaltet. Befehl des Kommandanten: Dunkelheit, damit sie uns nicht finden."
      - "<muted>23:55 Uhr. Sie finden uns trotzdem. Mit Licht hätten wir sie wenigstens kommen sehen."
      - "<muted>Wer das liest: Schalte ihn wieder ein. Die Krankenstation braucht den Strom."
      - "<dark>Techniker O. Kranz"
  clinic:
    name: "Krankenakte"
    body:
      - "<muted>Patient 12. Biss am Unterarm, Fieber 41,2 Grad. Kein Puls seit 06:10 Uhr."
      - "<muted>06:25 Uhr. Patient 12 sitzt aufrecht."
      - "<muted>Die Leichenhalle ist verriegelt. Die Fächer sind von innen zerkratzt."
      - "<muted>Wer das findet: Haltet die Fenster zu und bleibt zusammen."
      - "<dark>Dr. E. Vogt"
