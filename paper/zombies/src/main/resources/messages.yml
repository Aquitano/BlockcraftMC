join:
  introduction: "<prefix><muted>Überlebe allein oder im Team <max-waves> Wellen. <accent>/zombies <muted>erklärt dir die Steuerung."
guide:
  item: "<arrow><zombies>Spielanleitung"
  title: "<arrow><zombies>Zombies <dark>· <muted>Spielanleitung"
  body:
    - "<zombies>Ein bis vier Spieler verteidigen den Außenposten. Die Gegnerzahl wächst mit eurem Team."
    - "<muted>Mit Rechtsklick schießt du, mit Linksklick lädst du nach. Dein Messer liegt im dritten Slot. Kopftreffer verursachen mehr Schaden."
    - "<muted>Treffer, Kills und reparierte Fenster bringen Gold. Kaufe an Stationen Waffen und Rüstung. Bei zwei Waffen ersetzt ein Kauf die gehaltene Waffe."
    - "<muted>Öffne die Kupfertore und schalte den Strom ein. Dann stehen Perks, Waffenverbesserungen und die Team-Wiederbelebung bereit."
    - "<muted>Schleiche neben einem Fenster, um es zu reparieren. Nahe Gegner verhindern die Reparatur. Reparaturgold ist pro Welle begrenzt."
    - "<muted>Schleiche neben einem gefallenen Mitspieler, um ihn zu retten. Verblutete Spieler kehren nach der Welle zurück und verlieren ihre Perks. Fällt der letzte Spieler, verliert das Team."
    - "<muted>Im Solo-Spiel rettet dich der Perk Schnelle Wiederbelebung einmal vor dem Tod und wird dabei verbraucht."
    - "<muted>Nach <heal-delay> Sekunden ohne Schaden heilst du dich langsam. Gold und Ausrüstung gelten nur für diese Runde. Netzwerk-Coins und Stats bleiben erhalten."
    - "<muted>Im Außenposten liegen Notizen auf Lesepulten. Sie erzählen, was hier passiert ist. Jede Notiz, die du zum ersten Mal liest, bringt Netzwerk-Coins."
