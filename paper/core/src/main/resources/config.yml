sudo:
  protected-players:
    - Aquitano

# /near without a radius looks this far, in blocks; a typed radius may not exceed max-radius.
near:
  default-radius: 100
  max-radius: 500

# Blocked words and advertisement terms live in chat-filter.yml, which the proxy's private chat checks too.
chat:
  cooldown-seconds: 3
  # How often global mute and /chatslow, both switched on the proxy, are re-read from the database.
  network-refresh-seconds: 3

# What a player can pick in the /report dialog; the choice is stored as the report's reason, free text appended.
report:
  reasons:
    - Hacking
    - Beleidigung
    - Teaming
    - Bugusing
    - Werbung
    - Sonstiges

# A nick hides the name, the skin and the rank: it shows one of the ranks listed here (LuckPerms group names),
# picked at random unless /nick <rank> names one.
nick:
  ranks:
    - default
    - premium
  names:
