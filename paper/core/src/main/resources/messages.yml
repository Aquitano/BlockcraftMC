flyspeed:
  enabled: "<prefix><gray>Dein Flyspeed wurde <white>aktiviert<gray>!"
  disabled: "<prefix><gray>Dein Flyspeed wurde <white>deaktiviert<gray>!"
food:
  done: "<prefix><gray>Du hast nun keinen Hunger mehr!"
gm:
  usage: "<prefix><red>Benutze /gm [1,2,3]"
