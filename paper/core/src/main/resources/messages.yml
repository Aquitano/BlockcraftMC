speed:
  enabled: "<prefix><gray>Speed wurde <white>aktivert<gray>!"
  disabled: "<prefix><gray>Speed wurde <white>deaktiviert<gray>!"
sudo:
  usage: "<prefix><red>Benutze /sudo \\<name> \\<nachricht>"
