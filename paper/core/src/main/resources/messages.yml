  done: "<prefix><gray>Du hast den Regen <white>aktiviert<gray>!"
sun:
  done: "<prefix><gray>Du hast den Regen <white>deaktiviert<gray>!"
time:
  usage: "<prefix><red>Benutze /time [tag,nacht,10...]"
