  shop-lore: "<click>Shop öffnen"
  spawn: "<primary>Zurück zum Spawn"
  spawn-lore: "<click>Teleportieren"
  jump: "<primary>JumpAndRun"
  description:
    qsg:
      - "<muted>Kit wählen, Beute sammeln, überleben."
      - "<muted>Jeder gegen jeden. Keine Teams."
      - "<dark>Der Kompass ist kein Freundschaftsarmband."
    rush:
      - "<muted>Erze abbauen, Ausrüstung erhandeln."
      - "<muted>Dein Vorrat entscheidet im Deathmatch."
      - "<dark>Der Villager akzeptiert keine Ratenzahlung."
    duell:
      - "<muted>Ein Gegner. Ihr bestimmt den Modus."
      - "<muted>1vs1, SurvivalGames oder SuperJump."
      - "<dark>Ausreden bitte erst nach dem Duell einreichen."
    mlgrush:
      - "<muted>1vs1 mit Rückstoß-Sticks und eigenen Betten."
      - "<muted>Eine schmale Brücke. Fünf Punkte zum Sieg."
    bedwars:
      - "<muted>Vier Teams zu zweit. Schütze dein Bett."
      - "<muted>Ohne Bett gibt es kein Zurück."
      - "<dark>Schlafen ist im Bett ausdrücklich verboten."
    zombies:
      - "<muted>Allein oder zu viert gegen 30 Wellen."
      - "<muted>Waffen kaufen, Fenster reparieren, Freunde retten."
      - "<dark>Die Nachtschicht dauert heute etwas länger."
    cores:
      - "<muted>Rot gegen Blau, zwei Cores pro Team."
      - "<muted>Abbauen, craften, verzaubern, angreifen."
      - "<dark>Wie früher. Nur ohne Lag, hoffentlich."
    endergames:
      - "<muted>Survival Games in einer zufälligen Welt."
      - "<muted>Kits mit Fähigkeiten, wandernde Enderkisten."
      - "<dark>Und plötzlich stehst du woanders."
    ttt:
      - "<muted>Innocents, Detectives und Traitors."
      - "<muted>Finde die Verräter, bevor sie dich finden."
      - "<dark>Vertrau niemandem. Auch nicht dem Tester."
    skywars:
      - "<muted>Jeder auf seiner Insel, darunter das Nichts."
      - "<muted>Kisten plündern, Brücken bauen, runterschubsen."
      - "<dark>Der Boden ist Lava. Nur ohne Boden."
