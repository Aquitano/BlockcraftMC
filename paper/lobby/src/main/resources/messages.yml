# Notes lying about the lobby (lore-notes in config.yml). pages are the book's pages, one entry each; found answers
# the first read of a note.
lore:
  found: "<prefix><success>Notiz gefunden: <accent><note><muted>! <dark>(<white><found><dark>/<white><total><dark>) <muted>+<accent><coins> Coins"
  menu-found: "<click>Nochmal lesen"
  menu-unknown: "<muted>Verlorene Notiz"
  menu-unknown-lore: "<dark>Irgendwo in der Lobby liegt sie noch."
  gruendung:
    title: "Gründungsurkunde"
    author: "Die Gründer"
    pages:
      - "<dark>Gründungsurkunde<newline><newline>Im Jahr 2018 wurde auf einem kleinen Server ein Netzwerk gegründet. Ein paar Spielmodi, eine Lobby und sehr viel Kaffee."
      - "Die Regeln waren einfach:<newline><newline>1. Habt Spaß.<newline>2. Kein Teaming.<newline>3. Wer den Server zum Absturz bringt, gibt eine Runde aus."
      - "2026 zog das Netzwerk um, von Spigot 1.8 auf eine neue Zeit. Die Lobby blieb. Manche sagen, die Kekse auch."
  baumeister:
    title: "Notizbuch des Baumeisters"
    author: "Ein Baumeister"
    pages:
      - "Tag 1: Die Burg steht. Zu schief, sagt der Chef. Ich sage: mittelalterlich."
      - "Tag 4: Jemand hat Kuchen ins Archiv gestellt. Ich lasse ihn da. Vielleicht findet ihn ja jemand, der ihn mehr braucht."
      - "Tag 9: Im Kerker sitzt jetzt einer. Er sagt, er sei unschuldig. Das sagen sie alle."
  zettel:
    title: "Zerknitterter Zettel"
    author: "Unbekannt"
    pages:
      - "Wenn du das liest, schau nachts mal genauer hin. Manchmal steht da jemand mit weißen Augen am Waldrand.<newline><newline>Sag ihm nicht, dass ich es dir verraten habe."
  bahnhof:
    title: "Fahrplan"
    author: "Lobby-Bahnhof"
    pages:
      - "<dark>Abfahrten<newline><newline>BedWars: sofort<newline>SkyWars: sofort<newline>TTT: wenn alle bereit sind<newline>Zombies: Nachtschicht<newline>Beta: verschollen"
  tagebuch:
    title: "Tagebuch eines Neulings"
    author: "Spieler #1"
    pages:
      - "Heute zum ersten Mal hier. Jemand hat mich im Chat begrüßt. Ich habe aus Versehen den Kompass gegessen. Kann man den essen?"
      - "Später: Man kann ihn nicht essen. Aber man kann damit überallhin. Morgen probiere ich EnderGames. Angeblich steht man da plötzlich woanders."

