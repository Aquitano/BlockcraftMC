    zimmer: "Das Zimmer"
    wagen: "Auf dem Wagen"
    nacht: "Gute Nacht!"
    abwasser: "Abwasser?"
    abfall: "Abfall"
    hinrichtung: "Hinrichtung"
    statue: "Statue"
    ruhe: "Ruh dich aus!"
    abgelegen: "Abgelegen"
    prinzessin: "Die Prinzessin"
    kerker: "Burgkerker"
    quelle: "An der Quelle"
    rumhaengen: "Rumhängen"
    beta: "Beta-Server"
    kuchen: "Der Kuchen"
    enderauge: "Das vierte Auge"
    retro: "Retro"
    karpfen: "Goldener Karpfen"
    goldenesei: "Goldenes Ei"
    sternschnuppe: "Sternschnuppe"
    herobrine: "Herobrine"
  # Shown on every secret still missing, once a player found secrets.riddles-after of them (config.yml).
  riddle:
    zimmer: "Jedes Haus hat ein Zimmer, das niemand betritt."
    wagen: "Wer mitfahren will, muss erst aufsteigen."
    nacht: "Dort, wo man sich hinlegt, wenn es dunkel wird."
    abwasser: "Wo das Wasser hinfließt, wenn keiner hinsieht."
    abfall: "Was andere wegwerfen, ist für dich ein Fund."
    hinrichtung: "Ein Ort, an dem früher Urteile vollstreckt wurden."
    statue: "Sie steht still, seit es die Lobby gibt."
    ruhe: "Wer lange läuft, braucht irgendwann eine Bank."
    abgelegen: "Am Rand der Lobby, wo kaum jemand hinläuft."
    prinzessin: "Ganz oben im rosa Turm wartet jemand. Hoffentlich im richtigen Schloss."
    kerker: "Unter der Burg rasseln Ketten. Eine Leiter führt hinab."
    quelle: "Wo das Wasser herkommt, ist es am klarsten."
    rumhaengen: "Manchmal muss man einfach abhängen."
    beta: "Hoch über allem steht, was vor allem anderen da war."
    kuchen: "Wer gute Nacht sagt, bekommt vielleicht ein Stück. Vielleicht."
    enderauge: "Drei Augen sehen die ganze Lobby. Das vierte fehlt in einer Hütte."
    retro: "Oben, oben, unten, unten … den Rest kennst du."
    karpfen: "Wer am Wasser Geduld hat, zieht manchmal Gold heraus."
    goldenesei: "Manche Hühner legen mehr als nur Frühstück."
    sternschnuppe: "Zwischen zehn am Abend und zwei in der Nacht hat der Himmel manchmal einen Wunsch frei."
    herobrine: "Es gibt ihn nicht. Trotzdem steht nachts manchmal jemand in der Ferne. Geh hin, bevor er geht."
  sign:
    border: "<dark><strikethrough>-----------"
    tag: "<muted>[SECRET]"
    name: "<primary><name>"
  already-found: "<prefix><error>Dieses Secret hast du bereits gefunden!"
  cake:
    - "<prefix><muted>Der Kuchen ist eine Lüge."
    - "<prefix><muted>Du greifst nach dem Kuchen. Er ist aus Pappe."
    - "<prefix><muted>Dieser Kuchen ist nur zum Anschauen. Wie jeder gute Kuchen."
  eye-taken: "<prefix><muted>Du hast ein <accent>Enderauge <muted>gefunden <dark>(<accent><found><dark>/<accent><total><dark>)<muted>. Es schaut zurück."
  eye-last: "<prefix><muted>Das letzte <accent>Enderauge <muted>(<accent><found><dark>/<accent><total><muted>). Irgendwo in einer Hütte fehlt eines."
  eye-known: "<prefix><muted>Dieses Auge trägst du schon bei dir."
  eye-missing: "<prefix><muted>Hier fehlt ein Auge. Du hast <accent><found><dark>/<accent><total><muted>."
  eye-filled: "<prefix><accent>Das vierte Auge leuchtet. <muted>Halt dich fest."
  found-title: "<muted>Secret gefunden!"
  found-subtitle: "<accent>+<coins> Coins"
  found:
    - "<primary>Secrets <dark>● <muted>Du hast folgendes <white>Secret <muted>gefunden<dark>: <white><secret><dark>!"
