    - "<prefix><primary>Gefangener: <muted>Hast du einen Löffel? Ich grabe seit Jahren. Bisher nur Erde."
    - "<prefix><primary>Gefangener: <muted>Sag dem Wärter, die Spinnweben waren schon da, als ich kam."
    - "<prefix><primary>Gefangener: <muted>Ich wollte nur die Prinzessin retten. Falsches Schloss, sagen sie."
    - "<prefix><primary>Gefangener: <muted>Die Leiter da oben? Gehört nicht mir. Ich darf nicht drauf."
    - "<prefix><primary>Gefangener: <muted>Psst. Wenn du nachts in die Ferne schaust ... schau lieber nicht zu lange."
  hurt:
