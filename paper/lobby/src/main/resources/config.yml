max-players: 100
allowed-commands:
  - coins
  - cc
  - setspawn
  - setholo
prices:
  premium: 15000
  head: 300
  shirt: 500
secrets:
  reward: 50
shop-npc:
  respawn-seconds: 500
# /setholo accepts these names; every one needs a holo.<name> block in messages.yml. Placing a name again replaces
# its hologram, and the lines are re-read from messages.yml on every start.
holograms:
  - quicksg
  - emeraldrush
  - duell
fireworks:
  - { x: -65, y: 22.5, z: 56 }
  - { x: -69, y: 22.5, z: 56 }
double-jump:
  height: 0.6
  multiply: 1.0
jump-pad:
  y: 0.18
  multiply: 5.0
  max-length: 6.0
player-hider:
  cooldown-millis: 3000
effects:
  kill-price: 500
  win-price: 500
gadgets:
  cooldown-seconds: 5
hud:
  refresh-seconds: 5
# Navigator entry -> server group to join; stale-seconds matches the proxy's discovery setting.
navigator:
  groups:
    qsg: quicksg
    rush: emeraldrush
    duell: duell
  stale-seconds: 20
