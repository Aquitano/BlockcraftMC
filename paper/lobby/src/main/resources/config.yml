# Between from-hour and until-hour in the network calendar zone, each check has a one-in-odds chance that Herobrine
# stands about distance blocks ahead of one active player, visible only to them, for at most seconds. Coming within
# vanish-distance makes him vanish and finds the Herobrine bonus secret. After an appearance he waits
# cooldown-seconds.
herobrine:
  enabled: true
  from-hour: 22
  until-hour: 4
  check-seconds: 60
  odds: 120
  cooldown-seconds: 3600
  distance: 32
  vanish-distance: 16
  seconds: 30

# During these occasions everyone holds the season's throwable in the fourth slot (snowballs, pumpkins at Halloween,
# eggs at Easter) and pushes whoever they hit by knockback; cooldown-ticks pass between two throws.
throw-fight:
  during: [winter, halloween, easter]
  knockback: 0.5
  cooldown-ticks: 10


# A figure in front of each game's area, at the map's npc-<area> spot (/lobbyset npc-<area>, where you stand and
# look). It turns to the nearest player within look-radius and one of them moves every idle-seconds. skins names
# the player whose skin each figure wears; empty wears the game host's skin.
game-npcs:
  look-radius: 8
  idle-seconds: 6
  skins:
    qsg: ""
    rush: ""
    duell: ""
    bedwars: ""
    mlgrush: ""
    zombies: ""
    cores: ""
    endergames: ""
    ttt: ""
    skywars: ""

# Notes and books lying in the lobby, at the map's note-<key> spots (/lobbyset note-<key>, looking at the block they
# lie on), each as the item named here; their text is lore.<key> in messages.yml. The first read pays reward coins.
lore-notes:
  reward: 15
  notes:
    gruendung: WRITTEN_BOOK
    baumeister: BOOK
    zettel: PAPER
    bahnhof: MAP
    tagebuch: WRITABLE_BOOK

# The boards at spawn, at board-changelog and board-rules (/lobbyset, looking at the block). The changelog opens once
# for everyone who returns after version changes; the rules board runs the proxy's rules command.
notice-boards:
  changelog-version: "2026-10"
  rules-command: regeln

# The boss bar of news over the lobby: the next line of news.lines every seconds.
news:
  enabled: true
  seconds: 12
  color: purple

# Particles round each game's figure, seen by players within radius who have effects on, every ticks.
ambience:
  enabled: true
  radius: 32
  ticks: 15
  particles:
    endergames: PORTAL
    bedwars: SMALL_FLAME
    ttt: CRIMSON_SPORE
    skywars: CLOUD
    zombies: SCULK_SOUL
    cores: END_ROD
    qsg: ENCHANT
    rush: HAPPY_VILLAGER
    duell: CRIT
    mlgrush: SCRAPE
    knockbackffa: POOF
    archive: WHITE_ASH

# One-off quests from figures at the map's quest-<key> spots (/lobbyset quest-<key>, where you stand). A task is
# notes (find count lore notes), parkour (finish it once) or play (a row in the game's stats table). The reward is
# paid once, with the unlock lobby.quest.<key>.
quests:
  archivarin:
    skin: ""
    reward: 50
    task: {type: notes, count: 3}
  laeuferin:
    skin: ""
    reward: 50
    task: {type: parkour}
  kundschafter:
    skin: ""
    reward: 50
    task: {type: play, table: bc_skywars_stats}

# The daily login reward (/daily, a chat line on arrival, and a figure at the optional /lobbyset daily spot). One claim
# per day in the network's calendar zone; consecutive days raise the streak, a missed day starts it again at day 1.
# coins pays day 1, 2, ... of a streak, the last value every day after. preview-days is how many coming days the
# dialog lists (0 to 7); skin is the figure's player name, empty for the default look.
daily-rewards:
  coins: [10, 15, 20, 25, 30, 40, 60]
  preview-days: 3
  skin: ""
