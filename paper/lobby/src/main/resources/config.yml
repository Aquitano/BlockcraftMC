# Santa's sleigh crosses the sky above a lobby player every interval-seconds while one of during is celebrated, height
# blocks up, length blocks long and flight-ticks long. It drops presents, each worth present-coins to the first to catch
# it, one per player and flight; uncaught presents vanish after present-seconds. Staff send it with /schlitten.
sleigh:
  enabled: true
  during: [christmas]
  interval-seconds: 600
  height: 18
  length: 80
  flight-ticks: 240
  presents: 4
  present-coins: 15
  present-seconds: 30

# Now and then one of models, props pieces with their front along +z, crosses the sky height blocks above the spawn,
# length blocks from end to end in flight-ticks, every interval-seconds while anyone is about. Staff send one with
# /ueberflug.
flights:
  enabled: true
  interval-seconds: 240
  height: 40
  length: 200
  flight-ticks: 1000
  models: [airship, birds]

# Small effects at the map's ambient-<effect>-<n> spots (/lobbyset, up to spots of each), seen by players within radius
# who have effects on: count particles of particle, spread blocks round the spot at speed, every ticks.
ambient:
  enabled: true
  radius: 40
  effects:
    fireflies: {particle: FIREFLY, count: 2, spread: 3, speed: 0, ticks: 10, spots: 4}
    mist: {particle: SPLASH, count: 8, spread: 1.2, speed: 0.1, ticks: 5, spots: 2}
    motes: {particle: SPORE_BLOSSOM_AIR, count: 3, spread: 4, speed: 0, ticks: 10, spots: 2}

# Seasonal scenes at the map's spots (/lobbyset). In winter snowfight-figures figures stand at each of snowfight-a-<n>
# and snowfight-b-<n> behind a snow wall, wearing the skin textures in snowfight-skins in turn (the value of a head's
# textures property, as NameMC's /give commands carry it; the default look while it is empty); one throws every
# throw-ticks, and one a player hits throws back after answer-ticks. At Halloween a witch stirs the cauldron one block
# ahead of halloween-witch, bats circle bat-radius blocks round halloween-bats once every bat-lap-seconds, and a ghost
# drifts ghost-speed blocks a tick along halloween-ghost-1 to ghost-spots and back.
