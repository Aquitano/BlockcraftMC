# Up to players.max play a round; the lobby counts down once players.min are there, and a round needs at least
# players.round-minimum. A full lobby jumps to countdown.full seconds, /start to countdown.start.
players:
  min: 4
  max: 12
  round-minimum: 3

# After the lobby, everyone loots for countdown.preparation seconds without being able to hurt anyone; then the roles
# are drawn and the round runs countdown.round seconds, after which the innocents win. The server restarts
# countdown.restart seconds after the round.
countdown:
  lobby: 60
  start: 10
  full: 15
  preparation: 30
  round: 600
  restart: 20
idle-restart-minutes: 50
timer-bar: true
global-stats-head: Kevos

# traitor-ratio of the players are traitors, rounded to the nearest and at least one, so six players already face
# two. From detective-min-players on, detective-ratio of them are detectives, rounded down and at least one. Nobody
# is told how many traitors there are.
roles:
  traitor-ratio: 0.25
  detective-ratio: 0.125
  detective-min-players: 6

# Karma starts at start and never exceeds max. Killing your own side costs team-kill, an innocent or detective
# killing a traitor earns enemy-kill, and a round without a team kill earns clean-round. Blows deal karma/max of
# their damage, never less than damage-floor.
karma:
  start: 1000
  max: 1000
  team-kill: 100
  enemy-kill: 20
  clean-round: 30
  damage-floor: 0.5

# What a correct kill and a win pay in coins; a kill of your own side pays nothing.
rewards:
  kill: 5
  win: 20

# Traitors and detectives start with start-points shop points; a traitor earns one per innocent or detective killed,
# a detective one per traitor. A radar points at the nearest target for radar-seconds; a heal station heals
# per-second health points within radius blocks for seconds; a medipack heals medipack health points at once
# (20 is full health). Creeper arrows come creeper-arrows at a time; landmines, fake chests and creeper arrows
# explode with explosion-power (a creeper is 3) and break no blocks.
# A mask wears a corpse's face for mask-seconds. A time bomb goes off after seconds with power unless someone cuts the
# right one of its wires. The silenced pistol fires shots for damage each up to range blocks; the taser holds whoever
# it hits for seconds, charges times. A bear trap holds its victim for seconds and hurts them by damage. A jammer
# silences radars, motion sensors, mine detectors, crime cameras and the tester within radius of its holder for
# seconds. A motion sensor notes everyone within radius. A defibrillator brings back an innocent who died at most
# window-seconds ago, after hold-seconds beside the corpse, with health. The vest takes vest of every hit's damage.
# The mine detector shows traps within mine-detector-radius; the crime camera replays crime-camera-seconds before a
# death and a third of that after it.
shop:
  start-points: 2
  radar-seconds: 60
  medipack: 10
  creeper-arrows: 3
  explosion-power: 3.0
  heal-station:
    seconds: 60
    radius: 3.0
    per-second: 1.0
  mask-seconds: 60
  time-bomb:
    seconds: 45
    power: 5.0
    wires: 4
  silenced-pistol:
    shots: 3
    damage: 8.0
    range: 40
  taser:
    charges: 2
    seconds: 4
    range: 12
  bear-trap:
    seconds: 3
    damage: 4.0
  jammer:
    seconds: 30
    radius: 20.0
  motion-sensor-radius: 4.0
  defibrillator:
    window-seconds: 30
    hold-seconds: 3
    health: 10.0
  vest: 0.3
  mine-detector-radius: 10.0
  crime-camera-seconds: 6
  prices:
    medipack: 1
    radar: 1
    creeper-arrows: 2
    landmine: 2
    spoofer: 3
    fake-chest: 2
    knife: 2
    mask: 2
    lighter: 1
    time-bomb: 3
    silenced-pistol: 2
    bear-trap: 1
    poison: 1
    jammer: 2
    heal-station: 1
    dna-scanner: 1
    golden-sword: 3
    motion-sensor: 1
    taser: 2
    defibrillator: 2
    vest: 1
    mine-detector: 1
    crime-camera: 2

# The tester shows its result delay-seconds after the button, for show-seconds, and rests cooldown-seconds after
# every press. On a map with a traitor trap, its floor stays open for trap-seconds.
tester:
  delay-seconds: 3
  show-seconds: 4
  cooldown-seconds: 20
  trap-seconds: 3

# Whether players heal on their own. Without it, only medipacks, heal stations and a traitor's kills heal.
natural-regeneration: false

# A living traitor who kills an innocent or detective heals traitor-kill-heal health points (20 is full health).
traitor-kill-heal: 4.0

# 1.8 PvP: no attack cooldown, everything else stays vanilla.
pvp:
  legacy-combat: true

# A town chest gives one of these, picked by weight, and is gone. The ender chest gives an iron sword, once per
# round and only after the preparation.
chests:
  loot:
    - {item: WOODEN_SWORD, amount: 1, weight: 30}
    - {item: STONE_SWORD, amount: 1, weight: 18}
    - {item: BOW, amount: 1, weight: 14}
    - {item: ARROW, amount: 12, weight: 16}
    - {item: LEATHER_CHESTPLATE, amount: 1, weight: 6}
    - {item: CHAINMAIL_HELMET, amount: 1, weight: 4}
    - {item: GOLDEN_APPLE, amount: 1, weight: 2}

# TTT 2, the mode a server plays when BLOCKCRAFT_TTT_MODE is tasks, on maps that have chores. The innocents get
# per-player chores when the roles are drawn; the traitors get none. The chests are looted as in TTT, and each
# chore done also pays one pick from loot. When every living innocent's chores are done, the innocents win. A
# player's chores lie at least spread blocks apart where the map allows, so the work sends them across the town. A
# hold chore takes hold-seconds with the player's eyes within reach blocks of its station, as far as a click reaches.
# Traitors sabotage from their shop, one at a time and cooldown-seconds apart: a blackout darkens everyone else for
# blackout-seconds unless mended at the generator, doors shut every door for doors-seconds, and tester puts the tester
# out for tester-seconds unless mended at its button. Mending takes repair-seconds.
tasks:
  per-player: 4
  hold-seconds: 6
  reach: 4.5
  spread: 24
  loot:
    - {item: STONE_SWORD, amount: 1, weight: 26}
    - {item: BOW, amount: 1, weight: 14}
    - {item: ARROW, amount: 10, weight: 18}
    - {item: LEATHER_CHESTPLATE, amount: 1, weight: 12}
    - {item: CHAINMAIL_HELMET, amount: 1, weight: 10}
    - {item: CHAINMAIL_LEGGINGS, amount: 1, weight: 6}
    - {item: GOLDEN_APPLE, amount: 1, weight: 8}
    - {item: IRON_SWORD, amount: 1, weight: 6}
  sabotage:
    cooldown-seconds: 90
    blackout-seconds: 40
    doors-seconds: 15
    tester-seconds: 60
    repair-seconds: 5
