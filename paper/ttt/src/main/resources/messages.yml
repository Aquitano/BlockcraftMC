    set: "<muted>Der Bewegungsmelder merkt sich ab jetzt, wer vorbeikommt."
    entry: "<white><player> <dark>· <muted>vor <minutes>:<seconds>"
    nobody: "<muted>Hier ist noch niemand vorbeigekommen."
  mine-detector:
    found: "<muted>Minensucher<dark>: <accent><traps> <muted>in der Nähe"
