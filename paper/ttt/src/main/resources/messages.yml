prefix: "<ttt>TTT <dark>» <reset>"
game-name: "<ttt>TTT"

commands:
  start:
    description: "Verkürzt den Countdown der Lobby"
  forcemap:
    description: "Legt die Map der nächsten Runde fest"
  setup:
    description: "Setzt den Spawn der TTT-Lobby"
  stats:
    description: "Zeigt die Stats eines Spielers"
  top:
    description: "Zeigt die Top 10 einer Kategorie"
  tc:
    description: "Schreibt den anderen Traitorn"

join:
  introduction: "<prefix><muted>Unter euch sind Traitor. Finde sie, bevor sie dich finden, und töte keine Unschuldigen."

roles:
  traitor: "Traitor"
  detective: "Detective"
  innocent: "Innocent"
  title: "<role>"
  assigned: "<prefix><muted>Du bist <role><muted>."
  goal:
    traitor: "<muted>Töte alle Innocents und Detectives."
    detective: "<muted>Finde die Traitor. Alle vertrauen dir."
    innocent: "<muted>Überlebe und finde die Traitor."
  partners: "<prefix><muted>Deine Traitor-Partner<dark>: <error><players>"
  alone: "<prefix><muted>Du bist der einzige Traitor. Viel Glück."
  detectives: "<prefix><muted>Detective<dark>: <accent><players>"
  traitors: "<prefix><muted>Die Rollen sind verteilt. Wie viele Traitor unter euch sind, weiß niemand. Mit <accent>/tc <muted>schreiben Traitor einander."

item:
  shop: "<arrow><role>-Shop"
  vote: "<arrow><primary>Abstimmung"

vote:
  title: "<arrow><ttt>TTT <dark>· <muted>Abstimmung"
  map: "<arrow><primary><map>"
  builders: "<bullet><muted>Erbaut von <accent><builders>"
  chance: "den Zufall"
  result:
    - "<prefix><muted>Gespielt wird <accent><map><muted>."

round:
  preparation: "<prefix><muted>Durchsucht die Kisten! In <accent><seconds> Sekunden <muted>werden die Rollen verteilt."
  preparation-tasks: "<prefix><muted>Seht euch um. In <accent><seconds> Sekunden <muted>werden Rollen und Aufgaben verteilt."
  winner:
    traitors: "<prefix><error>Die Traitor haben gewonnen!"
    innocents: "<prefix><success>Die Innocents haben gewonnen!"
    chores: "<prefix><success>Alle Aufgaben sind erledigt. Die Innocents haben gewonnen!"
  draw: "<prefix><muted>Die Runde ist ohne Sieger zu Ende."
  traitors: "<prefix><muted>Die Traitor waren<dark>: <error><players>"

timer:
  preparation: "<ttt>Rollen in <dark>● <white><time>"
  round: "<ttt>Verbleibende Zeit <dark>● <white><time>"

karma:
  team-kill: "<prefix><error>Du hast jemanden aus deinem eigenen Team getötet! <muted>Karma<dark>: <error>-<lost> <dark>(<white><karma><dark>)"

shop:
  title: "<arrow><ttt>TTT <dark>· <muted>Shop"
  price: "<bullet><muted>Preis<dark>: <accent><price> Punkte"
  buy: "<click>Kaufen"
  missing: "<bullet><error>Dir fehlen <points> Punkte"
  balance: "<arrow><primary>Deine Punkte<dark>: <accent><points>"
  too-expensive: "<prefix><error>Dir fehlen noch <points> Punkte."
  bought: "<prefix><muted>Gekauft<dark>: <accent><item>"
  earned: "<prefix><muted>Du hast jetzt <accent><points> Punkte<muted>."
  owned: "<prefix><error>Das hast du schon."
  no-room: "<prefix><error>Dafür ist hier kein Platz. Stell es auf freien Boden."
  fake-chest-own: "<prefix><muted>Das ist eine Falle für die anderen."
  radar-expired: "<prefix><muted>Dein Radar ist erloschen."
  radar-distance: "<muted>Radar<dark>: <accent><distance> Blöcke"
  golden-sword-wrong: "<prefix><error>Das war kein Traitor. Das goldene Schwert richtet sich gegen dich."
  mask:
    worn: "<prefix><muted>Du trägst jetzt ein fremdes Gesicht. Es hält nicht lange."
    fallen: "<prefix><muted>Die Maske ist abgefallen. Du bist wieder du selbst."
    no-face: "<prefix><error>Dieser Leiche kannst du kein Gesicht mehr nehmen."
  lighter:
    burned: "<prefix><muted>Die Leiche ist verbrannt. Niemand wird je wissen, wer das war."
  time-bomb:
    title: "<arrow><ttt>TTT <dark>· <muted>Zeitbombe"
    timer: "<error><bold><seconds>"
    armed: "<prefix><muted>Die Bombe tickt, <accent><seconds> Sekunden<muted>. Der richtige Draht ist <accent><wire><muted>."
    wire: "<arrow><muted>Draht<dark>: <accent><wire>"
    cut: "<click>Durchschneiden"
    defused: "<prefix><success>Entschärft. Das war knapp."
    wrong: "<prefix><error>Falscher Draht!"
    wires:
      red: "rot"
      blue: "blau"
      yellow: "gelb"
      green: "grün"
      white: "weiß"
      black: "schwarz"
      purple: "lila"
  bear-trap:
    set: "<prefix><muted>Die Bärenfalle liegt bereit."
    caught: "<prefix><error>Du bist in eine Bärenfalle getreten!"
  poison:
    done: "<prefix><muted>Die Heilstation ist vergiftet. Sie sieht aus wie vorher."
    nothing: "<prefix><error>Träufle das Gift auf eine Heilstation, die noch sauber ist."
  jammer:
    started: "<prefix><muted>Der Störsender läuft <accent><seconds> Sekunden<muted>. Um dich herum funkt nichts mehr."
    stopped: "<prefix><muted>Dein Störsender ist aus."
    static: "<muted>Rauschen<dark>: <error>gestört"
    blocked: "<prefix><error>Hier stört etwas. Das Gerät zeigt nur Rauschen."
  taser:
    hit: "<prefix><muted>Du hast <accent><player> <muted>getasert."
    hit-you: "<prefix><error><player> hat dich getasert! <muted>Du kannst dich kurz nicht wehren."
  motion-sensor:
    title: "<arrow><ttt>TTT <dark>· <muted>Bewegungsmelder"
    set: "<prefix><muted>Der Bewegungsmelder merkt sich ab jetzt, wer vorbeikommt."
    entry: "<white><player> <dark>· <muted>vor <minutes>:<seconds>"
    nobody: "<muted>Hier ist noch niemand vorbeigekommen."
  mine-detector:
    found: "<muted>Minensucher<dark>: <accent><traps> <muted>in der Nähe"
  defibrillator:
    work: "<success>Wiederbelebung"
    traitor: "<prefix><error>Bei dieser Leiche schlägt der Defibrillator nicht an."
    too-late: "<prefix><error>Zu spät. Diese Leiche liegt schon zu lange hier."
    failed: "<prefix><error>Die Wiederbelebung hat nicht geklappt."
    revived: "<prefix><accent><medic> <muted>hat <white><player> <muted>wiederbelebt!"
  crime-camera:
    nothing: "<prefix><error>Für diesen Tod hat die Kamera nichts aufgezeichnet."
  items:
    medipack:
      name: "<success>Medipack"
      lore:
        - "<bullet><muted>Heilt dich um fünf Herzen."
    radar:
      name: "<accent>Radar"
      lore:
        - "<bullet><muted>Zeigt eine Minute lang auf den"
        - "<muted>nächsten Spieler, den du jagst."
    creeper-arrows:
      name: "<success>Creeper-Pfeile"
      lore:
        - "<bullet><muted>Wo sie landen, zischt ein Creeper."
    landmine:
      name: "<error>Landmine"
      lore:
        - "<bullet><muted>Explodiert unter jedem, der kein Traitor ist."
    spoofer:
      name: "<accent>Tester-Spoofer"
      lore:
        - "<bullet><muted>Der Tester hält dich beim"
        - "<muted>nächsten Mal für unschuldig."
    fake-chest:
      name: "<error>Fake-Kiste"
      lore:
        - "<bullet><muted>Explodiert, wenn jemand außer"
        - "<muted>einem Traitor sie öffnet."
    heal-station:
      name: "<success>Heilstation"
      lore:
        - "<bullet><muted>Heilt eine Minute lang alle,"
        - "<muted>die in der Nähe stehen."
    dna-scanner:
      name: "<accent>DNA-Scanner"
      lore:
        - "<bullet><muted>Zeigt an einer Leiche, wer"
        - "<muted>der Mörder war."
    golden-sword:
      name: "<primary>Goldenes Schwert"
      lore:
        - "<bullet><muted>Tötet einen Traitor mit einem Schlag."
        - "<bullet><error>Triffst du jemand anderen, stirbst du."
    knife:
      name: "<error>Messer"
      lore:
        - "<bullet><muted>Ein Stich in den Rücken tötet sofort."
        - "<bullet><muted>Von vorn kaum der Rede wert."
    mask:
      name: "<accent>Maske"
      lore:
        - "<bullet><muted>Nimm einer Leiche das Gesicht und"
        - "<muted>trag eine Weile ihren Namen."
    lighter:
      name: "<error>Feuerzeug"
      lore:
        - "<bullet><muted>Verbrennt eine Leiche, bevor"
        - "<muted>jemand weiß, wer sie war."
    time-bomb:
      name: "<error>Zeitbombe"
      lore:
        - "<bullet><muted>Tickt hörbar und geht hoch, wenn"
        - "<muted>niemand den richtigen Draht schneidet."
    silenced-pistol:
      name: "<error>Schalldämpfer-Pistole"
      lore:
        - "<bullet><muted>Ein paar Schüsse, die kaum"
        - "<muted>jemand hört."
    bear-trap:
      name: "<error>Bärenfalle"
      lore:
        - "<bullet><muted>Hält fest, wer hineintritt, und"
        - "<muted>schnappt laut zu. Traitor gehen drüber."
    poison:
      name: "<error>Gift"
      lore:
        - "<bullet><muted>Auf eine Heilstation geträufelt,"
        - "<muted>heilt sie nicht mehr, sie schadet."
    jammer:
      name: "<accent>Störsender"
      lore:
        - "<bullet><muted>Legt um dich herum Radar, Melder,"
        - "<muted>Minensucher, Kamera und Tester lahm."
    motion-sensor:
      name: "<accent>Bewegungsmelder"
      lore:
        - "<bullet><muted>Merkt sich, wer vorbeigeht."
        - "<bullet><muted>Ein Klick darauf zeigt die Liste."
    taser:
      name: "<accent>Taser"
      lore:
        - "<bullet><muted>Hält einen Verdächtigen kurz fest."
        - "<muted>Er kann nicht zuschlagen oder schießen."
    defibrillator:
      name: "<success>Defibrillator"
      lore:
        - "<bullet><muted>Holt einen Innocent zurück, der"
        - "<muted>gerade erst gestorben ist."
    vest:
      name: "<primary>Schutzweste"
      lore:
        - "<bullet><muted>Du nimmst bis zum Ende der Runde"
        - "<muted>weniger Schaden."
    mine-detector:
      name: "<accent>Minensucher"
      lore:
        - "<bullet><muted>In der Hand zeigt er dir Minen,"
        - "<muted>Fallen und Bomben in der Nähe."
    crime-camera:
      name: "<accent>Tatortkamera"
      lore:
        - "<bullet><muted>Zeigt an einer Leiche die letzten"
        - "<muted>Sekunden vor dem Tod. Ohne Gesichter."

