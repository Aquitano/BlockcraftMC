    innocent: "<muted>Überlebe und finde die Traitor."
  goal-tasks:
    traitor: "<muted>Töte alle Innocents und Detectives. Sabotage im Shop."
    detective: "<muted>Finde die Traitor. Alle Teamaufgaben erledigt heißt Sieg."
    innocent: "<muted>Erledigt alle Teamaufgaben, um zu gewinnen. Ziele im Buch."
