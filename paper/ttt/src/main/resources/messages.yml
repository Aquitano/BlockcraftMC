    medipack:
      name: "<success>Medipack"
      lore:
        - "<bullet><muted>Heilt dich um fünf Herzen."
    radar:
      name: "<accent>Radar"
      lore:
        - "<bullet><muted>Zeigt eine Minute lang auf den"
        - "<muted>nächsten Spieler, den du jagst."
    creeper-arrows:
      name: "<success>Creeper-Pfeile"
      lore:
        - "<bullet><muted>Wo sie landen, zischt ein Creeper."
    landmine:
      name: "<error>Landmine"
      lore:
        - "<bullet><muted>Explodiert unter jedem, der kein Traitor ist."
    spoofer:
      name: "<accent>Tester-Spoofer"
      lore:
        - "<bullet><muted>Der Tester hält dich beim"
        - "<muted>nächsten Mal für unschuldig."
    fake-chest:
      name: "<error>Fake-Kiste"
      lore:
        - "<bullet><muted>Explodiert, wenn jemand außer"
        - "<muted>einem Traitor sie öffnet."
    heal-station:
      name: "<success>Heilstation"
      lore:
        - "<bullet><muted>Heilt eine Minute lang alle,"
        - "<muted>die in der Nähe stehen."
    dna-scanner:
      name: "<accent>DNA-Scanner"
      lore:
        - "<bullet><muted>Prüft eine Leiche auf fremde DNA"
        - "<muted>und schätzt, wie lange sie dort liegt."
    golden-sword:
      name: "<primary>Goldenes Schwert"
      lore:
        - "<bullet><muted>Tötet einen Traitor mit einem Schlag."
        - "<bullet><error>Triffst du jemand anderen, stirbst du."
    knife:
      name: "<error>Messer"
      lore:
        - "<bullet><muted>Ein Stich in den Rücken tötet sofort."
        - "<bullet><muted>Von vorn kaum der Rede wert."
    mask:
      name: "<accent>Maske"
      lore:
        - "<bullet><muted>Nimm einer Leiche das Gesicht und"
        - "<muted>trag eine Weile ihren Namen."
    lighter:
      name: "<error>Feuerzeug"
      lore:
        - "<bullet><muted>Verbrennt eine Leiche, bevor"
        - "<muted>jemand weiß, wer sie war."
    time-bomb:
      name: "<error>Zeitbombe"
      lore:
        - "<bullet><muted>Tickt hörbar und geht hoch, wenn"
        - "<muted>niemand den richtigen Draht schneidet."
    silenced-pistol:
      name: "<error>Schalldämpfer-Pistole"
      lore:
        - "<bullet><muted>Ein paar Schüsse, die kaum"
        - "<muted>jemand hört."
    bear-trap:
      name: "<error>Bärenfalle"
      lore:
        - "<bullet><muted>Hält fest, wer hineintritt, und"
        - "<muted>schnappt laut zu. Traitor gehen drüber."
    poison:
      name: "<error>Gift"
      lore:
        - "<bullet><muted>Auf eine Heilstation geträufelt,"
        - "<muted>heilt sie nicht mehr, sie schadet."
    jammer:
      name: "<accent>Störsender"
      lore:
        - "<bullet><muted>Legt um dich herum Radar, Melder,"
        - "<muted>Minensucher, Kamera und Tester lahm."
    motion-sensor:
      name: "<accent>Bewegungsmelder"
      lore:
        - "<bullet><muted>Merkt sich, wer vorbeigeht."
        - "<bullet><muted>Ein Klick darauf zeigt die Liste."
    taser:
      name: "<accent>Taser"
      lore:
        - "<bullet><muted>Hält einen Verdächtigen kurz fest."
        - "<muted>Er kann nicht zuschlagen oder schießen."
    defibrillator:
      name: "<success>Defibrillator"
      lore:
        - "<bullet><muted>Holt einen Innocent zurück, der"
        - "<muted>gerade erst gestorben ist."
    vest:
      name: "<primary>Schutzweste"
      lore:
        - "<bullet><muted>Du nimmst bis zum Ende der Runde"
        - "<muted>weniger Schaden."
    mine-detector:
      name: "<accent>Minensucher"
      lore:
        - "<bullet><muted>In der Hand zeigt er dir Minen,"
        - "<muted>Fallen und Bomben in der Nähe."
    crime-camera:
      name: "<accent>Tatortkamera"
      lore:
        - "<bullet><muted>Zeigt an einer Leiche die letzten"
        - "<muted>Sekunden vor dem Tod. Ohne Gesichter."

