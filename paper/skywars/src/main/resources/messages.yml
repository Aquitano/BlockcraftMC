prefix: "<skywars>SkyWars <dark>» <reset>"
game-name: "<skywars>SkyWars"

commands:
  start:
    description: "Verkürzt den Countdown der Lobby"
  forcemap:
    description: "Legt die Map der nächsten Runde fest"
  stats:
    description: "Zeigt die Stats eines Spielers"
  top:
    description: "Zeigt die Top 10 einer Kategorie"

join:
  introduction: "<prefix><muted>Jeder startet auf seiner eigenen Insel. Plündere die Kisten, baue Brücken zur Mitte und wirf die anderen ins Nichts."

round:
  kit: "<prefix><muted>Du spielst mit dem Kit <skywars><kit><muted>."
  subtitle: "<muted>Gleich öffnen sich die Käfige"
  start: "<prefix><muted>Die Käfige sind offen. Die besten Kisten warten in der <skywars>Mitte<muted>."
  winner: "<prefix><primary><player> <primary>hat SkyWars gewonnen!"
  winner-left: "<prefix><primary><player> <primary>ist als Letzter übrig und gewinnt!"
  draw: "<prefix><error>Die Zeit ist um. Unentschieden!"

refill:
  soon: "<prefix><muted>Die Kisten füllen sich in <accent><seconds><muted> Sekunden neu."
  done: "<prefix><success>Alle Kisten wurden neu gefüllt!"

border:
  shrinking: "<prefix><error>Die Grenze schrumpft! <muted>Am Ende bleiben <accent><radius><muted> Blöcke um die Mitte."

build:
  too-high: "<prefix><error>So hoch kannst du nicht bauen."

timer:
  round: "<skywars>Verbleibende Zeit <dark>● <white><time>"

