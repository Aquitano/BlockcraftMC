players:
  min: 4
  max: 12
global-stats-head: Kevos

# The lobby counts down once players.min are there; a full lobby jumps to countdown.full seconds, /start to
# countdown.start. In the round the players wait countdown.freeze seconds in their cages. refill-after seconds later
# every chest fills once more, from border-after seconds the border closes on the middle, and countdown.round seconds
# after the start the round ends in a draw.
countdown:
  lobby: 60
  start: 10
  full: 15
  freeze: 5
  round: 900
  refill-after: 300
  border-after: 600
  restart: 15
idle-restart-minutes: 50
timer-bar: true

# Below void-height a player dies, credited to whoever hit them last; nobody builds above build-height. The border
# closes to final-radius blocks round the middle. The islands' top is at y 80.
arena:
  void-height: 40
  build-height: 125
  final-radius: 12

# 1.8 PvP: no attack cooldown, everything else stays vanilla.
pvp:
  legacy-combat: true

# What a kill and a win pay in coins.
rewards:
  kill: 5
  win: 20

# A kit's price in coins, 0 is free for everyone; a kit left out costs its default.
kits:
  standard: 0
  bauarbeiter: 300
  bogenschuetze: 400
  ritter: 500
  enderman: 500
  bomber: 400
  fischer: 300
  heiler: 500

# What the chests hold. Each spawn island has one chest of armour, one of weapons and tools and one of blocks, food
# and the rest, so nobody starts without a sword or without blocks; the semi-middles' and the middle's chests hold
# better loot. Each chest rolls between min-items and max-items of its loot, at the start and again at the refill.
# Potions heal.
chests:
  armour:
    min-items: 2
    max-items: 3
    loot:
