prefix: "<blue>QuickSG <dark_gray>» <reset>"
game-name: "QuickSG"

commands:
  start:
    description: "Startet die Runde"
  stats:
    description: "Zeigt die Stats eines Spielers"
  qsgset:
    description: "Setzt die QuickSG-Locations"
  top:
    description: "Zeigt die Top 10 einer Kategorie"

actionbar: "<dark_red>Teams verboten"

lobby:
  started: "<prefix><muted>Die Runde wurde gestartet."
  freeze-title: "<primary><seconds>"

protection:
  ends-in: "<prefix><muted>Die Schutzzeit endet in <accent><seconds><muted> Sekunden!"
  over: "<prefix><error>Die Schutzzeit ist vorbei!"

game:
  tracker: "<prefix><muted><minutes> Minuten sind vorbei, alle Spieler bekommen einen Tracker!"
  ends-in-minutes: "<prefix><error>Das Spiel endet in <minutes> Minuten!"
  ends-in-one-minute: "<prefix><error>Das Spiel endet in 1 Minute!"
  draw: "<prefix><error>Unentschieden, die Runde wird neu gestartet!"
  killed: "<prefix><white><player><muted> wurde von <white><killer><muted> getötet."
  died: "<prefix><white><player> <muted>ist gestorben."


timer:
  protection: "<primary>Schutzzeit <dark>● <white><seconds>s"
  game: "<primary>Spielzeit <dark>● <white><time>"

tracker:
  found: "<prefix><white><player> <arrow><white><distance><muted> Blöcke"

start:
  not-enough-players: "<prefix><error>Es müssen mindestens 2 Spieler online sein!"
  only-in-lobby: "<prefix><error>Du kannst die Runde nur im Lobby-Modus starten!"
  already-started: "<prefix><error>Die Runde wurde bereits gestartet!"
  coins-added: "<prefix><muted>Du hast diesem Spieler <accent><coins> <muted>Coins hinzugefügt!"

setup:
  help:
    - ""
    - "<muted>/qsgset lobby, Spectator, Pos1(-8), DM1(-4), Lobbymitte, InGamemitte"
    - ""
  set: "<prefix><muted>Du hast die Location <white><location> <muted>gesetzt!"
  unknown: "<prefix><error>Unbekannte Location. Siehe /qsgset help"

stats:
  header: "<muted>Stats von <accent><player>"
  lines:
    - "<arrow><primary>Siege<dark>: <muted><wins>"
    - "<arrow><primary>Niederlagen<dark>: <muted><losses>"
    - "<arrow><primary>Tode<dark>: <muted><deaths>"
    - "<arrow><primary>Kills<dark>: <muted><kills>"
    - "<arrow><primary>Punkte<dark>: <muted><points>"

top:
  separator: "<muted><strikethrough>---------------------------------"
  first: "<accent><bold>#1 <reset><primary><name><muted> ( <white><value><muted> )"
  entry: "<reset>#<rank> <primary><name> <muted>( <white><value><muted> )"
  unknown-category: "<prefix><error>/top <wins|deaths|kills|loses|points>"

kit:
  selected: "<prefix><muted>Du hast das <white><kit><muted> ausgewählt!"
  not-owned: "<prefix><error>Du hast dieses Kit noch nicht gekauft!"
  bought: "<prefix><muted>Du hast das <white><kit> <muted>gekauft!"
  bought-cost: "<arrow><muted>- <accent><price> <muted>Coins"
  already-owned: "<prefix><error>Du hast dieses Kit bereits gekauft!"
  not-enough-coins: "<prefix><error>Du hast nicht genug Coins!"
  starter:
    name: "Starter Kit"
    contents:
      - "<arrow><muted>1 Holz Schwert"
  bow:
    name: "Bogen Kit"
    contents:
      - "<arrow><muted>1 Bogen"
      - "<arrow><muted>12 Pfeile"
  hearts:
    name: "Herzen Kit"
    contents:
      - "<arrow><muted>3 Herzen mehr"
  chain:
    name: "Chain Kit"
    contents:
      - "<arrow><muted>1 Chain Helm"
      - "<arrow><muted>1 Chain Hose"
      - "<arrow><muted>1 Chain Schuhe"
  diamond:
    name: "Diamant Kit"
    contents:
      - "<arrow><muted>1 Diamanten Brustpanzer"
      - "<arrow><muted>1 Holz Schwert"

menu:
  kits:
    title: "<arrow><primary>Kits"
    entry: "<arrow><aqua><kit>"
  kit-detail:
    title: "<arrow><primary>Kit <dark>● <accent><kit>"
    price: "<muted>Preis"
    price-free: "<success>kostenlos"
    price-coins: "<arrow><accent><price> Coins"
    select: "<muted>Auswählen"
    buy: "<success>Kaufen"
    bought: "<success>bereits gekauft!"
  stats:
    title: "<arrow><primary>Stats"
    player: "<accent><player>"
    player-lore:
      - "<arrow><primary>Siege<dark>: <muted><wins>"
      - "<arrow><primary>Niederlagen<dark>: <muted><losses>"
      - "<arrow><primary>Tode<dark>: <muted><deaths>"
      - "<arrow><primary>Kills<dark>: <muted><kills>"
