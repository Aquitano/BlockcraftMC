  global-stats:
    title: "<arrow><primary>Globale Stats"
    wins: "<arrow><aqua>Siege"
    deaths: "<arrow><aqua>Tode"
    kills: "<arrow><aqua>Kills"
    losses: "<arrow><aqua>Niederlagen"
    points: "<arrow><aqua>Punkte"

item:
  kits: "<arrow><primary>Kits"
  hub: "<arrow><primary>Hub"
  stats: "<arrow><primary>Stats"
  start: "<arrow><primary>Spiel starten"
  level-up:
    name: "<accent>+1 Level"
    lore: "<bullet><muted>Rechtsklick"
  heart:
    name: "<accent>+1 Herz"
    lore: "<bullet><muted>Rechtsklick"
  full-food:
    name: "<accent>Voller Hunger"
    lore: "<bullet><muted>Dein Hunger wird sofort gefüllt!"
  tracker:
    name: "<primary>Kompass"
    lore: "<bullet><muted>Tracke Spieler in deiner Nähe"

scoreboard:
  title: "<arrow><primary><ip> <dark>«"
  online: "<muted>SPIELER"
  online-value: "<arrow><white><online> <dark>/<white> <max>"
  map: "<muted>MAP"
  map-value: "<arrow><white><map>"
  kit: "<muted>KIT"
  kit-value: "<arrow><white><kit>"
  spectator: "<muted>ZUSCHAUER"
  spectator-value: "<arrow><white><spectators>"
  winner: "<muted>GEWINNER"
  winner-value: "<arrow><white><player>"
