players:
  min: 1
  max: 4
countdown:
  lobby: 30
  start: 5
  restart: 15
idle-restart-minutes: 50
timer-bar: false
global-stats-head: Kevos
# How long a running mission keeps the place of a member who dropped out; 0 turns it off.
rejoin-seconds: 300
rewards:
  win: 25

# The conversation panel above the hotbar. A line with a recording types out at its pace instead, never slower than
# half this. A line without answers closes this long after it is read and spoken; 0 waits for sneak.
dialogue:
  characters-per-tick: 1.5
  linger-seconds: 6
  # The hotbar slot the panel rests on, whose neighbours are not among the numbered answers 1 to 5.
  resting-slot: 6

blaster:
  damage: 6
  cooldown-ticks: 6
  range: 48

defense:
  wave-seconds: 15
  wave-size: 3
  most-droids: 6
  droid-health: 12
  droid-damage: 2
  # How far a droid's bolt strays from its aim, as a share of its direction.
  droid-spread: 0.06
  droid-model: hegemonie_soldier

# Positions on Wrack von Tessar as x y z [yaw pitch]. The BetonQuest package names the relay and console itself.
mission:
  landing:
    - -81.5 65 -5.5 270 0
    - -81.5 65 -1.5 270 0
    - -81.5 65 2.5 270 0
    - -81.5 65 6.5 270 0
  rally: -81.5 65 0.5 270 0
  vela: -75.5 65 0.5 90 0
  vela-model: kolonien_soldier
  droid-spawns:
    - -4.5 65 -52.5
    - 5.5 65 -52.5
    - -6.5 65 -34.5
    - 7.5 65 -34.5

# Each scene is timed in ticks. `shots` are camera keyframes that look from `at` towards `look`, or towards an actor's
# head with `follow`; `cut: true` starts a new shot. `actors` walk through their `marks` with BetterModel's walk and
# play the `gestures` of their model (talk, point, beckon, nod, rest, look), `idle` for the whole scene; `vela` is the
# NPC herself and every other actor is spawned for the scene. `lines` are subtitles from messages.yml with the voice
# of the same key. `craft` flies a ship's model past, `emitters` keep particles going, `sounds` play to each viewer,
# at `at` when it is given, and `effects` are EXPLOSION or FLARE.
cutscenes:
  characters-per-tick: 1.5
  fade-ticks: 12
  scenes:
    intro:
      shots:
        - {tick: 0, at: "-6 122 64", look: "-78 66 0"}
        - {tick: 60, at: "-30 114 46", look: "-78 66 0"}
        - {tick: 120, at: "-52 104 30", look: "-80 67 0"}
        - {tick: 121, at: "-80.5 66.2 -4.0", follow: vela, cut: true}
        - {tick: 160, at: "-80.2 66.25 -3.6", follow: vela}
        - {tick: 205, at: "-79.6 66.3 -3.0", follow: vela}
        - {tick: 206, at: "-78.4 66.75 -1.6", follow: vela, cut: true}
        - {tick: 270, at: "-78.2 66.7 -1.2", follow: vela}
        - {tick: 271, at: "-77.6 66.2 2.4", follow: vela, cut: true}
        - {tick: 365, at: "-77.9 66.3 1.9", follow: vela}
      actors:
        vela:
          model: kolonien_soldier
          marks:
            - {tick: 0, at: "-66.5 65 0.5 90 0"}
            - {tick: 125, at: "-66.5 65 0.5 90 0"}
            - {tick: 195, at: "-75.5 65 0.5 90 0"}
            - {tick: 215, at: "-75.5 65 0.5 110 -4"}
            - {tick: 290, at: "-75.5 65 0.5 95 -2"}
            - {tick: 330, at: "-75.5 65 0.5 70 -4"}
          gestures:
            - {tick: 214, play: talk}
            - {tick: 270, stop: talk}
            - {tick: 292, play: beckon}
            - {tick: 306, play: talk}
            - {tick: 350, stop: talk}
        guard:
          model: kolonien_heavy
          idle: look
          marks:
            - {tick: 0, at: "-79.5 65 8.5 200 0"}
        talker:
          model: kolonien_scout
          idle: talk
          marks:
            - {tick: 0, at: "-71.5 65 -6.5 135 0"}
        listener:
          model: kolonien_medic
          idle: rest
          marks:
            - {tick: 0, at: "-73.5 65 -8.5 315 0"}
          gestures:
            - {tick: 150, play: nod}
            - {tick: 240, play: nod}
        patrol:
          model: kolonien_soldier
          marks:
            - {tick: 0, at: "-89.5 65 -12.5 0 0"}
            - {tick: 170, at: "-89.5 65 10.5 0 0"}
            - {tick: 200, at: "-89.5 65 10.5 270 0"}
            - {tick: 360, at: "-74.5 65 12.5 270 0"}
      lines:
        - {tick: 15, ticks: 95, speaker: funk, text: cutscene.intro.1}
        - {tick: 212, ticks: 76, speaker: vela, text: cutscene.intro.2}
        - {tick: 290, ticks: 70, speaker: vela, text: cutscene.intro.3}
      craft:
        - {tick: 0, ticks: 130, model: sternenfront/dropship/kolonien, scale: 7, from: "-4 112 70", to: "-104 84 -14"}
      emitters:
        - {type: DUST, at: "-60 70 10", every: 4}
        - {type: SMOKE, at: "-70 66 14", every: 3}
      sounds:
        - {tick: 0, sound: "blockcraft:story.ambience.wind", volume: 0.7}
        - {tick: 0, sound: "blockcraft:sternenfront.intro.radio_open", volume: 0.8}
        - {tick: 121, sound: "blockcraft:story.ambience.base", volume: 0.6}
        - {tick: 240, sound: "blockcraft:story.ambience.wind", volume: 0.4}
    ending-fabrik:
