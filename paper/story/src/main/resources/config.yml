players:
  min: 1
  max: 4
countdown:
  lobby: 30
  start: 5
  restart: 15
idle-restart-minutes: 50
timer-bar: false
global-stats-head: Kevos
# How long a running mission keeps the place of a member who dropped out; 0 turns it off.
rejoin-seconds: 300
rewards:
  win: 25

# The conversation panel above the hotbar. A page types out evenly in typing-ticks, ahead of its voice, but a short one
# no slower than slowest-characters-per-tick. A line without answers closes this long after it is read and spoken; 0
# waits for sneak. Party members within audience-radius of the member who talks watch and hear the conversation.
dialogue:
  typing-ticks: 30
  slowest-characters-per-tick: 1
  linger-seconds: 6
  audience-radius: 12
  # The hotbar slot the panel rests on, whose neighbours are not among the numbered answers 1 to 5.
  resting-slot: 6

blaster:
  damage: 6
  cooldown-ticks: 6
  range: 48

defense:
  wave-seconds: 15
  wave-size: 3
  most-droids: 6
  droid-health: 12
  droid-damage: 2
  # How far a droid's bolt strays from its aim, as a share of its direction.
  droid-spread: 0.06
  droid-model: hegemonie_soldier

# Positions on Wrack von Tessar as x y z [yaw pitch]. The BetonQuest package names the relay and console itself.
mission:
  landing:
    - -81.5 65 -5.5 270 0
    - -81.5 65 -1.5 270 0
    - -81.5 65 2.5 270 0
    - -81.5 65 6.5 270 0
  rally: -81.5 65 0.5 270 0
  vela: -75.5 65 0.5 90 0
  vela-model: kolonien_soldier
  droid-spawns:
    - -4.5 65 -52.5
    - 5.5 65 -52.5
    - -6.5 65 -34.5
    - 7.5 65 -34.5

# Each scene is timed in ticks. `shots` are camera keyframes that look from `at` towards `look`, or with `follow` at an
# actor `height` blocks above its feet (1.3 unless given) wherever it is; `cut: true` starts a new shot. Within a shot
# the camera eases in and out once and keeps its pace through every keyframe between. A cut further than
# `far-cut-blocks` dips to black over `fade-ticks`, since the client still has to load the new place. `actors` walk
# through their `marks` facing where they go, and play the `gestures` of their model (point, beckon, nod, rest, look),
# `idle` for the whole scene; an actor talks while a line it speaks is voiced. `vela` is the NPC herself and every
# other actor is spawned for the scene. `walk-paces` are how far each body's walk carries it per tick, the stride over
# the cycle that resourcepack/RigModels.py animates, so the legs keep pace with the ground. `lines` are subtitles from
# messages.yml with the voice of the same key, typing out at the dialogue's pace. `craft` flies a ship's model past,
# and one that `stays` waits where it arrives; `emitters` keep particles going, `sounds` play to each viewer, at `at`
# when it is given, and `effects` are EXPLOSION or FLARE; an EXPLOSION with a `radius` breaks the blocks around it,
# throws debris and leaves fire and smoke until the round ends.
cutscenes:
  fade-ticks: 12
  far-cut-blocks: 48
  walk-paces: {soldier: 0.1125, heavy: 0.059, scout: 0.183, medic: 0.121}
  scenes:
    # One move: behind the dropship over the basin, down into the yard ahead of Vela, who walks up to the camera.
    intro:
      shots:
        - {tick: 0, at: "-6 122 64", look: "-78 66 0"}
        - {tick: 60, at: "-30 114 46", look: "-78 66 0"}
        - {tick: 105, at: "-52 96 22", look: "-68 66 1"}
        - {tick: 148, at: "-71 70.2 -0.7", follow: vela}
        - {tick: 185, at: "-76.6 66.9 -0.8", follow: vela}
        - {tick: 230, at: "-77.6 66.5 -0.9", follow: vela}
        - {tick: 300, at: "-77.3 66.45 -0.3", follow: vela}
        - {tick: 365, at: "-77.1 66.4 0.3", follow: vela}
      actors:
        vela:
          model: kolonien_soldier
          marks:
            - {tick: 0, at: "-64.5 65 0.5 90 0"}
            - {tick: 130, at: "-64.5 65 0.5 90 0"}
            - {tick: 210, at: "-75.5 65 0.5 90 0"}
            - {tick: 224, at: "-75.5 65 0.5 112 -3"}
            - {tick: 290, at: "-75.5 65 0.5 100 -2"}
            - {tick: 345, at: "-75.5 65 0.5 80 -3"}
          gestures:
            - {tick: 294, play: beckon}
        guard:
          model: kolonien_heavy
          idle: look
          marks:
            - {tick: 0, at: "-79.5 65 8.5 200 0"}
        talker:
          model: kolonien_scout
          idle: talk
          marks:
            - {tick: 0, at: "-71.5 65 -6.5 135 0"}
        listener:
          model: kolonien_medic
          idle: rest
          marks:
            - {tick: 0, at: "-73.5 65 -8.5 315 0"}
          gestures:
            - {tick: 150, play: nod}
            - {tick: 240, play: nod}
        patrol:
          model: kolonien_soldier
          marks:
            - {tick: 0, at: "-89.5 65 -12.5 0 0"}
            - {tick: 170, at: "-89.5 65 10.5 0 0"}
            - {tick: 200, at: "-89.5 65 10.5 270 0"}
            - {tick: 360, at: "-74.5 65 12.5 270 0"}
      lines:
        - {tick: 15, ticks: 95, speaker: funk, text: cutscene.intro.1}
        - {tick: 212, ticks: 76, speaker: vela, text: cutscene.intro.2}
        - {tick: 290, ticks: 70, speaker: vela, text: cutscene.intro.3}
      craft:
        - {tick: 0, ticks: 130, model: sternenfront/dropship/kolonien, scale: 7, from: "-4 112 70", to: "-104 84 -14"}
      emitters:
        - {type: DUST, at: "-60 70 10", every: 4}
        - {type: SMOKE, at: "-70 66 14", every: 3}
      sounds:
        - {tick: 0, sound: "blockcraft:story.ambience.wind", volume: 0.7}
        - {tick: 0, sound: "blockcraft:sternenfront.intro.radio_open", volume: 0.8}
        - {tick: 150, sound: "blockcraft:story.ambience.base", volume: 0.6}
        - {tick: 240, sound: "blockcraft:story.ambience.wind", volume: 0.4}
    # Vela turns to the factory in the east and points, the fleet bombs it, and she turns back to the troop.
    ending-fabrik:
      shots:
        - {tick: 0, at: "-77.6 66.5 -0.9", follow: vela}
        - {tick: 40, at: "-77.7 66.55 -0.3", follow: vela}
        - {tick: 85, at: "-77.9 66.9 1.4", look: "-50 68 0.5"}
        - {tick: 86, at: "44 88 36", look: "82 72 2", cut: true}
        - {tick: 150, at: "53 84 27", look: "82 73 2"}
        - {tick: 215, at: "62 80 18", look: "82 73 2"}
        - {tick: 216, at: "-77.9 66.55 -1.3", follow: vela, cut: true}
        - {tick: 310, at: "-77.5 66.5 -0.4", follow: vela}
      actors:
        vela:
          model: kolonien_soldier
          marks:
            - {tick: 0, at: "-75.5 65 0.5 115 -2"}
            - {tick: 34, at: "-75.5 65 0.5 105 0"}
            - {tick: 50, at: "-75.5 65 0.5 268 -4"}
            - {tick: 200, at: "-75.5 65 0.5 268 -4"}
            - {tick: 216, at: "-75.5 65 0.5 115 -2"}
            - {tick: 310, at: "-75.5 65 0.5 100 -2"}
          gestures:
            - {tick: 50, play: point}
            - {tick: 228, play: nod}
        guard:
          model: kolonien_heavy
          idle: look
          marks:
            - {tick: 0, at: "-79.5 65 8.5 200 0"}
        talker:
          model: kolonien_scout
          idle: rest
          marks:
            - {tick: 0, at: "-71.5 65 -6.5 90 -25"}
      lines:
        - {tick: 5, ticks: 78, speaker: vela, text: cutscene.ending-fabrik.1}
        - {tick: 130, ticks: 80, speaker: funk, text: cutscene.ending-fabrik.2}
        - {tick: 228, ticks: 78, speaker: vela, text: cutscene.ending-fabrik.3}
      craft:
        - {tick: 86, ticks: 70, model: sternenfront/dropship/kolonien, scale: 7, from: "0 104 40", to: "96 92 -10"}
        - {tick: 96, ticks: 70, model: sternenfront/dropship/kolonien, scale: 7, from: "-6 108 30", to: "92 96 -22"}
      emitters:
        - {type: SMOKE, at: "82 72 -4", every: 2}
        - {type: SMOKE, at: "86 74 6", every: 2}
        - {type: EMBERS, at: "80 71 0", every: 3}
      # The Separatist hall at x 70 to 92 serves as the factory; each blast tears out the blocks within its radius.
      effects:
        - {tick: 112, type: EXPLOSION, at: "74 72 10", radius: 3.5}
        - {tick: 124, type: EXPLOSION, at: "82 77 4", radius: 4.5}
        - {tick: 138, type: EXPLOSION, at: "72 70 -6", radius: 3.5}
        - {tick: 150, type: EXPLOSION, at: "86 76 12", radius: 4}
        - {tick: 166, type: EXPLOSION, at: "80 73 18", radius: 3.5}
        - {tick: 182, type: EXPLOSION, at: "84 77 -8", radius: 4.5}
      sounds:
        - {tick: 0, sound: "blockcraft:story.ambience.base", volume: 0.5}
        - {tick: 86, sound: "blockcraft:story.ambience.wind", volume: 0.6}
        - {tick: 216, sound: "blockcraft:story.ambience.base", volume: 0.4}
    # Vela sends the gunship, it lands at the refinery and the prisoners walk to it, and she thanks the troop.
    ending-gefangene:
      shots:
        - {tick: 0, at: "-77.6 66.5 -0.9", follow: vela}
        - {tick: 85, at: "-77.3 66.45 0.2", follow: vela}
        - {tick: 86, at: "16 76 -37", look: "1 72 -43", cut: true}
        - {tick: 150, at: "12.5 71.5 -39.5", look: "1 70.5 -43"}
        - {tick: 215, at: "11.5 70 -41", look: "1 70 -43.5"}
        - {tick: 216, at: "-77.9 66.55 -1.3", follow: vela, cut: true}
        - {tick: 310, at: "-77.5 66.5 -0.4", follow: vela}
      actors:
        vela:
          model: kolonien_soldier
          marks:
            - {tick: 0, at: "-75.5 65 0.5 115 -2"}
            - {tick: 85, at: "-75.5 65 0.5 105 -2"}
            - {tick: 216, at: "-75.5 65 0.5 115 -2"}
            - {tick: 310, at: "-75.5 65 0.5 100 -2"}
          gestures:
            - {tick: 60, play: nod}
            - {tick: 228, play: nod}
        prisoner-1:
          model: kolonien_soldier
          idle: rest
          marks:
            - {tick: 0, at: "-2.5 65 -36.5 180 0"}
            - {tick: 140, at: "-2.5 65 -36.5 180 0"}
            - {tick: 215, at: "0.5 65 -46.5 180 0"}
        prisoner-2:
          model: kolonien_scout
          idle: rest
          marks:
            - {tick: 0, at: "1.5 65 -34.5 180 0"}
            - {tick: 150, at: "1.5 65 -34.5 180 0"}
            - {tick: 215, at: "2.5 65 -44.5 180 0"}
        prisoner-3:
          model: kolonien_heavy
          idle: rest
          marks:
            - {tick: 0, at: "4.5 65 -36.5 200 0"}
            - {tick: 145, at: "4.5 65 -36.5 200 0"}
            - {tick: 215, at: "3.5 65 -43.5 180 0"}
      lines:
        - {tick: 5, ticks: 78, speaker: vela, text: cutscene.ending-gefangene.1}
        - {tick: 130, ticks: 80, speaker: funk, text: cutscene.ending-gefangene.2}
        - {tick: 228, ticks: 78, speaker: vela, text: cutscene.ending-gefangene.3}
      craft:
        - {tick: 86, ticks: 60, model: sternenfront/dropship/kolonien, scale: 7, from: "40 100 -10", to: "0.5 76 -46", stays: true}
      emitters:
        - {type: DUST, at: "0.5 66 -45", every: 3}
      effects:
        - {tick: 100, type: FLARE, at: "0.5 82 -43.5"}
        - {tick: 125, type: FLARE, at: "-6.5 80 -38.5"}
        - {tick: 150, type: FLARE, at: "7.5 81 -48.5"}
      sounds:
        - {tick: 0, sound: "blockcraft:story.ambience.base", volume: 0.5}
        - {tick: 86, sound: "blockcraft:story.ambience.wind", volume: 0.6}
