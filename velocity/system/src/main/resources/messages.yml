  header: "<prefix><dark_aqua>---------<gold>Es sind <count> Server gefunden.<dark_aqua>----------"
  entry: "<prefix><dark_red><player> <muted>(<server>): <dark_red><message>"
  cleared: "<prefix><count> Server wurden gefunden."

tc:
  online-header: "<error>TeamChat <arrow><reset><muted>Im TeamChat sind gerade diese Spieler:"
  online-entry: "<muted>   - <error><player><muted> -<error> <server>"
  usage: "<error>TeamChat <arrow><reset><muted>Verwende bitte <aqua>/tc \\<message> <muted>um eine Nachricht an alle Team-Mitglieder zu senden."
  format: "<error>TeamChat <arrow><reset><aqua><player><reset> (<server>): <primary><message>"
watch:
  joined: "<prefix><error><player> <muted>ist online: <accent><reports> <muted>offene Reports, <accent><punishments> <muted>Strafen in den letzten <accent><days> <muted>Tagen."
  hover: "<muted>Klicke für <aqua>/whois <player>"
  banned-alts: "<prefix><error><player> <muted>nutzt eine Verbindung, über die <accent><count> <muted>gebannte Accounts gespielt haben."
