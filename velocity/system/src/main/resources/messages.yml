prefix: "<primary><ip> <dark>» <reset>"

# The network's colours, the same tags the Paper plugins use (BlockcraftAPI messages.yml); youtuber only the proxy needs.
palette:
  primary: "<blue>"
  accent: "<yellow>"
  muted: "<gray>"
  dark: "<dark_gray>"
  success: "<green>"
  error: "<red>"
  bullet: "<dark_gray>● "
  arrow: "<dark_gray>» "
  quicksg: "<gold>"
  emeraldrush: "<green>"
  duell: "<aqua>"
  bedwars: "<dark_aqua>"
  premium: "<gold>"
  youtuber: "<dark_purple>"
player-only: "<error>Nur ein Spieler kann diesen Befehl verwenden!"
player-unknown: "<prefix><error>Der Spieler <accent><player> <error>ist unbekannt."
player-ambiguous: "<prefix><error>Der Name <accent><player> <error>passt gerade auf mehrere Spieler, darum passiert nichts."
no-permission: "<prefix><error>Dazu hast du keine Berechtigung."
request-failed: "<prefix><error>Die Anfrage konnte nicht ausgeführt werden. Bitte melde das dem Team."
command-blocked: "<prefix><error>Nicht verfügbar!"
# Blocked commands that answer with a line of their own instead of command-blocked, picked anew on every try.
blocked-replies:
  pl: &plugins
    - "<muted>Plugins (6): <success>Kaffee, Geduld, Redstone, Kevos, Spaghetti, Tagebuch"
    - "<muted>Plugins (6): <success>Kaffee, Kaffee, Kaffee, Kaffee, Kaffee, Kaffee"
  plugins: *plugins
  version: "<muted>Dieser Server läuft auf <primary>Blockcraft 1.8.9-nostalgie<muted>. Neueste Version? Für uns schon."
kicked-to-lobby: "<prefix><muted>Deine <error>Verbindung <muted>zum Server <error><server><muted> wurde getrennt. Grund: <error><reason>"
resource-pack:
  prompt: "<primary><ip> <muted>braucht unser Texturenpaket für <white>eigene Menüs und Symbole<muted>."
help:
  - "<bullet><primary>INFORMATIONEN ZUM SERVER <dark>●"
  - ""
  - "  <primary>/lobby <muted>- <white>Kehre in die Lobby zurück!"
  - "  <primary>/play <muted>- <white>Tritt einem Spiel bei!"
  - "  <primary>/report <muted>- <white>Reporte einen verdächtigen Spieler!"
  - "  <primary>/msg <muted>- <white>Sende einem Spieler eine private Nachricht!"
  - "  <primary>/party <muted>- <white>Erstelle eine Party!"
  - "  <primary>/friend <muted>- <white>Verwalte Freunde oder schau ihrer Runde zu."
  - "  <primary>/ignore <muted>- <white>Verwalte deine ignorierten Spieler."
  - "  <primary>/discord <muted>- <white>Öffne den Discord-Link oder verknüpfe deinen Account."
  - "  <primary>/premium /yt <muted>- <white>Erhalte Infos zu den Rängen!"
  - ""

duration:
  second: Sekunde
  seconds: Sekunden
  minute: Minute
  minutes: Minuten
  hour: Stunde
  hours: Stunden
  day: Tag
  days: Tage
  week: Woche
  weeks: Wochen
  month: Monat
  months: Monate
  year: Jahr
  years: Jahre
  remaining: "<time>"
  permanent: "<error>Permanent"

login:
  maintenance:
    - "<prefix><muted>Du kannst <error><ip> <muted>derzeit nicht betreten."
    - " <muted>Derzeit sind <error>Wartungsarbeiten<muted>."
  full:
    - "<prefix><muted>Das maximale <error>Spielerlimit <muted>von <error><max> <muted>ist erreicht."
    - "<error>"
    - "<muted>Nur noch <error>Spieler <muted>mit dem <error>Premium-Rang <muted>können noch <error>beitreten."
    - "<muted>Discord: <error><discord>"
  error:
    - "<prefix><muted>Die Datenbank von <error><ip> <muted>ist derzeit nicht erreichbar."
    - " <muted>Bitte versuche es in ein paar Minuten erneut."

tab:
  header:
    - "<muted>"
    - " <muted>» <primary><ip> <dark>✘ <accent>Dein Netzwerk <muted>« "
    - " <muted>Derzeit spielen <accent><online><dark>/<accent><max> <muted>Spieler "
    - " <muted>"
  footer:
    - "<muted>"
    - " <muted>Server <arrow><accent><server> <dark>"
    - " <muted>Discord <arrow><accent><discord><dark> "
    - " <muted>Forum <arrow><accent><website> "
    - "<muted>"

broadcast:
  friends: "<primary>Wusstest du? <bullet><muted>Mit /friend jump schaust du der Runde eines Freundes zu."
  premium: "<primary>Wusstest du? <bullet><muted>Ränge wie Premium unterstützen <ip>. Du findest sie auf <shop>."
  report: "<primary>Wusstest du? <bullet><muted>Mit /report meldest du verdächtiges Verhalten direkt dem Team."
  teamspeak: "<primary>Wusstest du? <bullet><muted>Unser TeamSpeak erreichst du unter <teamspeak>."
  support: "<primary>Wusstest du? <bullet><muted>Bei Fragen oder Problemen hilft dir /support weiter."
  youtuber: "<primary>Wusstest du? <bullet><muted>Du machst Videos über <ip>? Mit /youtuber erfährst du alles zum YouTuber-Rang."
  discord: "<primary>Wusstest du? <bullet><muted>Über /discord findest du Hilfe und Neuigkeiten."
  pond: "<primary>Wusstest du? <bullet><muted>Im Teich soll ein goldener Karpfen leben. Geduld hilft."
  retro: "<primary>Wusstest du? <bullet><muted>Manche Tastenfolgen sind älter als Minecraft."
  secrets: "<primary>Wusstest du? <bullet><muted>Der Villager hat Quittungen verloren. Frag den Teich."

motd:
  maintenance-version: "<error>Wartungsmodus <muted><online><dark>/<muted><max>"
  maintenance-line: "<muted>Der <error>Wartungsmodus<muted> ist derzeit aktiviert!"
  wrong-version: "<error><bold>Falsche Version!"
  # Shown where the client would list who is online.
  sample:
    - "<accent><ip>"
    - "<muted>Online: <accent><online><dark>/<muted><max>"
    - ""
    - "<muted>Discord <dark>● <accent><discord>"
    - "<muted>Website <dark>● <accent><website>"
    - "<muted>Shop <dark>● <accent><shop>"
  usage:
    - "<prefix><error>/motd setdefault \\<motd>"
    - "<prefix><error>/motd add \\<motd>"
    - "<prefix><error>/motd del \\<zahl>"
    - "<prefix><error>/motd clear"
    - "<prefix><error>/motd list"
  del-usage: "<prefix><error>/motd del \\<zahl>"
  del-range: "<prefix><error>/motd del \\<zahl 1-<max>>"
  list-header: "<prefix><dark>----------<primary>Motds<dark>----------"
  list-default: "<prefix><primary>Default-Motd: <muted><motd>"
  list-empty: "<prefix><muted>Es sind keine Random-Motds eingetragen. Füge eine mit <accent>/motd add \\<motd> <muted>hinzu."
  list-entry: "<prefix><number>: <muted><motd>"
  cleared: "<prefix><muted><count> Random-Motds wurden erfolgreich gelöscht!"
  default-set: "<prefix><muted>Die Default-Motd wurde erfolgreich zu \"<white><motd><muted>\" geändert!"
  added: "<prefix><muted>Die Motd \"<white><motd><muted>\" wurde erfolgreich hinzugefügt!"
  removed: "<prefix><muted>Die Motd \"<white><motd><muted>\" wurde erfolgreich gelöscht!"
  # The second line, in this order: the network's birthday (calendar.founded in config.yml), then the returning
  # player last seen at the pinging address if they opted in, then one of motd.random in config.yml.
  birthday: "<accent><ip> <muted>wird heute <accent><years> Jahre <muted>alt!"
  birthday-one: "<accent><ip> <muted>wird heute <accent>ein Jahr <muted>alt!"
  welcome-back: "<muted>Willkommen zurück, <accent><player><muted>."
  welcome-back-friend: "<muted>Willkommen zurück, <accent><player><muted>! <success>1 <muted>Freund online."
  welcome-back-friends: "<muted>Willkommen zurück, <accent><player><muted>! <success><count> <muted>Freunde online."

setmax:
  current: "<prefix><muted>Es können maximal <accent><max><muted> Spieler online sein!"
  done: "<prefix><muted>Die maximale <accent>Spieleranzahl<muted> wurde zu <accent><max><muted> gesetzt!"

moderation:
  self: "<prefix><error>Das kannst du nicht mit dir selbst machen."
  protected: "<prefix><error>Dieser Spieler steht im Rang über dir oder gleich mit dir."
  issuer-outranks: "<prefix><error>Das hat jemand mit höherem Rang als du verhängt."
  error: "<prefix><error>Die Strafe konnte nicht gespeichert werden. Bitte versuche es erneut."

ban:
  use-strafe: "<prefix><error>Nutze Folgendes: <accent>/strafe"
  notify:
    - "<error><bold>Strafe <arrow><reset><error><player><muted> wurde vom <error>Netzwerk <muted>gesperrt."
    - "<error><bold>Strafe <arrow><reset><muted>Grund: <error><reason>"
    - "<error><bold>Strafe <arrow><reset><muted>Von: <error><issuer>"
    - "<error><bold>Strafe <arrow><reset><muted>Länge: <error><remaining>"
  screen-temporary:
    - "<muted>Du wurdest vom <primary><ip> Netzwerk <muted>gebannt."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Verbleibende Zeit: <success>"
    - "<success><remaining>"
    - " "
    - " <muted>Unrechter Ban? Stelle einen <accent>Entbannungsantrag<muted> im Forum:"
    - " <accent><website>/Forum "
    - " <muted>oder auf dem TeamSpeak:"
    - " <accent><teamspeak>"
  screen-permanent:
    - "<muted>Du wurdest vom <primary><ip> Netzwerk <muted>gebannt."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Dieser Bann ist <error>permanent<muted>: Er läuft nicht ab"
    - " <muted>und endet nur, wenn das Team ihn aufhebt."
    - " "
    - " <muted>Unrechter Ban? Stelle einen <accent>Entbannungsantrag<muted> im Forum:"
    - " <accent><website>/Forum "
    - " <muted>oder auf dem TeamSpeak:"
    - " <accent><teamspeak>"
unban:
  usage: "<prefix><muted>Ausführung:<error> /unban \\<Spieler>"
  not-banned: "<prefix><muted>Dieser <error>Spieler <muted>ist nicht gebannt."
  done: "<prefix><muted>Der <error>Spieler <muted>wurde entbannt."
  notify:
    - "<error><bold>Strafe <arrow><reset><muted>Der Spieler <accent><player> <muted>wurde von <error><issuer> <muted>entbannt."
tempban:
  usage: "<prefix><muted>Ausführung:<error> /tempban \\<Spieler> \\<Dauer> \\<Grund>"
  unbannable: "<prefix><error>Du kannst diesen Spieler nicht bannen!"
  already-banned: "<prefix><muted>Dieser <error>Spieler <muted>ist bereits gebannt."
  too-long: "<prefix><error>Ein Bann dauert höchstens <accent><days> Tage<error>. Für einen dauerhaften nutze <accent>/strafe<error>."
  units:
    - "<prefix><muted>Die Dauer ist ein Wort aus Zahl und Einheit, zum Beispiel <error>30m<muted>, <error>12h <muted>oder <error>16d<muted>."
    - "<prefix><muted>Einheiten: <error>s <muted>| <error>m <muted>| <error>h <muted>| <error>d <muted>| <error>w <muted>| <error>mon <muted>| <error>y"
  done: "<prefix><muted>Der Spieler <error><player><muted> wurde erfolgreich gebannt."

mute:
  use-strafe: "<prefix><muted>Nutze <error>/strafe \\<Name> \\<Grund>"
  notify:
    - "<prefix><muted>Der Spieler <error><player> <muted>wurde <muted>gemutet."
    - "<prefix><muted>Grund: <error><reason>"
    - "<prefix><muted>Von: <error><issuer>"
    - "<prefix><muted>Verbleibende Zeit: <error><remaining>"
  screen-temporary:
    - "<muted>Du wurdest vom <primary><ip> Netzwerk <muted>gemutet."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Verbleibende Zeit: <success>"
    - "<success><remaining>"
    - " "
    - " <muted>Unrechter Mute? Stelle einen <accent>Entmutungsantrag<muted> im Forum:"
    - " <accent><website>/Forum "
    - " <muted>oder auf dem TeamSpeak:"
    - " <accent><teamspeak>"
  screen-permanent:
    - "<muted>Du wurdest vom <primary><ip> Netzwerk <muted>gemutet."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Dieser Mute ist <error>permanent<muted>: Er läuft nicht ab"
    - " <muted>und endet nur, wenn das Team ihn aufhebt."
    - " "
    - " <muted>Unrechter Mute? Stelle einen <accent>Entmutungsantrag<muted> im Forum:"
    - " <accent><website>/Forum "
    - " <muted>oder auf dem TeamSpeak:"
    - " <accent><teamspeak>"
  check-failed: "<prefix><error>Deine Nachricht konnte gerade nicht geprüft werden. Versuche es gleich noch einmal."
unmute:
  usage: "<prefix><muted>Ausführung:<error> /unmute \\<Spieler>"
  not-muted: "<prefix><muted>Dieser <error>Spieler<muted> ist nicht gemutet."
  done: "<prefix><muted>Dieser <error>Spieler <muted>wurde erfolgreich entmutet."
  notify:
    - "<prefix><muted>Der Spieler <error><player> <muted>wurde von <error><issuer> <muted>entmutet."
tempmute:
  usage: "<prefix><error>Ausführung: /tempmute \\<Spieler> \\<Dauer> \\<Grund>"
  already-muted: "<prefix><error>Dieser Spieler ist bereits gemutet."
  too-long: "<prefix><error>Ein Mute dauert höchstens <accent><days> Tage<error>. Für einen dauerhaften nutze <accent>/strafe<error>."
  units:
    - "<prefix><muted>Die Dauer ist ein Wort aus Zahl und Einheit, zum Beispiel <error>30m<muted>, <error>12h <muted>oder <error>16d<muted>."
    - "<prefix><muted>Einheiten: <error>s <muted>| <error>m <muted>| <error>h <muted>| <error>d <muted>| <error>w <muted>| <error>mon <muted>| <error>y"
  done: "<prefix><muted>Du hast den Spieler <error><player><muted> erfolgreich gemutet."

banlist:
  empty: "<prefix><accent>Derzeit sind keine Spieler gebannt."
  header: "<prefix><muted>Folgende Spieler sind gebannt: "
  entry: "<prefix><error><player> <dark>| <muted>/check<error> <player>"
  newest: "<prefix><muted>Es werden nur die neuesten <accent><shown> <muted>gezeigt."
  count: "<prefix><muted>Gebannte Spieler: <accent><count>"
mutelist:
  empty: "<prefix><muted>Es sind derzeit keine <error>Spieler <muted>gemutet."
  header: "<prefix><muted>Diese <error>Spieler <muted>sind derzeit gemutet:"
  entry: "<prefix><error><player> <dark>| <muted>/check <player>"
  newest: "<prefix><muted>Es werden nur die neuesten <accent><shown> <muted>gezeigt."
  count: "<prefix><muted>Gemutete Spieler: <accent><count>"

kick:
  usage: "<prefix><muted>Verwende <error>/kick \\<Spieler> \\<Grund>"
  offline: "<prefix><muted>Dieser <error>Spieler <muted>ist nicht online."
  done: "<prefix><muted>Du hast den <error>Spieler <muted>erfolgreich vom Netzwerk geworfen."
  notify:
    - "<prefix><error><player><muted> wurde von <error><issuer><muted> vom <primary><ip> Netzwerk <muted>gekickt."
    - "<prefix><muted>Grund: <success><reason>"
  screen:
    - "<muted>Du wurdest vom <primary><ip> Netzwerk <muted>gekickt. "
    - " <muted>Grund: <success><reason>"

check:
  usage: "<prefix><muted>Ausführung: <error>/check \\<Spieler>"
  banned:
    - "<prefix><dark><strikethrough>---------------------------------"
    - ""
    - "<prefix><muted>Spieler: <accent><player>"
    - "<prefix><muted>Gebannt von: <accent><issuer>"
    - "<prefix><muted>Grund: <accent><reason>"
    - "<prefix><muted>Verbleibende Zeit: <accent><remaining>"
    - ""
  not-banned:
    - "<prefix><dark><strikethrough>---------------------------------"
    - ""
    - "<prefix><muted>Der Spieler ist nicht gebannt."
    - ""
  muted:
    - "<prefix><dark><strikethrough>---------------------------------"
    - ""
    - "<prefix><muted>Spieler: <accent><player>"
    - "<prefix><muted>Gemuted von: <accent><issuer>"
    - "<prefix><muted>Grund: <accent><reason>"
    - "<prefix><muted>Verbleibende Zeit: <accent><remaining>"
    - ""
    - "<prefix><dark><strikethrough>---------------------------------"
  not-muted:
    - "<prefix><dark><strikethrough>---------------------------------"
    - ""
    - "<prefix><muted>Der Spieler ist nicht gemutet."
    - ""
    - "<prefix><dark><strikethrough>---------------------------------"
    - ""

history:
  usage: "<prefix><muted>Ausführung: <error>/history \\<Spieler>"
  header: "<prefix><muted>Strafen von <accent><player><muted>: <accent><bans> <muted>Bans <dark>| <accent><mutes> <muted>Mutes"
  empty: "<prefix><muted>Für <accent><player> <muted>ist keine Strafe gespeichert."
  entry: "<prefix><type> <dark>| <muted><date> <dark>| <accent><issuer> <dark>| <muted><reason> <dark>| <muted><duration><revoked>"
  revoked: " <dark>| <success>aufgehoben von <accent><revoker>"
  count: "<prefix><muted>Angezeigt: <accent><shown> <muted>von <accent><total><muted>."
  type-ban: "<error>Bann"
  type-mute: "<accent>Mute"
  # Java date pattern for the entries above; the German order belongs to the text, not to the code.
  date-format: "dd.MM.yyyy HH:mm"

# The staff audit log; <action> is the logged key such as gamemode.creative or invsee.edit.
stafflog:
  usage: "<prefix><muted>Ausführung: <error>/stafflog \\<Spieler> [Seite]"
  empty: "<prefix><muted>Von oder an <accent><player> <muted>ist keine Team-Aktion gespeichert."
  no-page: "<prefix><error>Diese Seite gibt es nicht. <muted>Seiten: <accent><pages>"
  header: "<prefix><primary>Team-Aktionen von und an <accent><player> <dark>| <muted>Seite <accent><page><muted>/<accent><pages> <dark>| <accent><total> <muted>Einträge"
  entry: "<prefix><muted><date> <dark>| <accent><issuer> <primary><action><target><detail> <dark>[<muted><server><dark>]"
  target: " <muted>an <accent><target>"
  detail: " <dark>(<muted><detail><dark>)"
  next: "<prefix><muted>Weiter mit <accent>/stafflog <player> <next>"
  date-format: "dd.MM.yyyy HH:mm"
  # One label per action key; a key without one shows as it is.
  labels:
    "back": "Zurückteleportiert"
    "build.on": "Baumodus an"
    "build.off": "Baumodus aus"
    "clear": "Inventar geleert"
    "coins.give": "Coins gegeben"
    "coins.take": "Coins abgezogen"
    "coins.set": "Coins gesetzt"
    "fly.on": "Flugmodus an"
    "fly.off": "Flugmodus aus"
    "food": "Hunger gestillt"
    "freeze.on": "Eingefroren"
    "freeze.off": "Aufgetaut"
    "gamemode.survival": "Spielmodus Überleben"
    "gamemode.creative": "Spielmodus Kreativ"
    "gamemode.adventure": "Spielmodus Abenteuer"
    "gamemode.spectator": "Spielmodus Zuschauer"
    "heal": "Geheilt"
    "invsee.read": "Inventar angesehen"
    "invsee.edit": "Inventar bearbeitet"
    "kill": "Getötet"
    "kill.entities": "Entities entfernt"
    "nick.on": "Nick an"
    "nick.off": "Nick aus"
    "speed": "Geschwindigkeit gesetzt"
    "staff.on": "Staff-Modus an"
    "staff.off": "Staff-Modus aus"
    "sudo": "Als Spieler ausgeführt"
    "tp": "Spieler teleportiert"
    "tp.to": "Selbst teleportiert"
    "tpall": "Alle hergeholt"
    "tphere": "Hergeholt"
    "vanish.on": "Vanish an"
    "vanish.off": "Vanish aus"

