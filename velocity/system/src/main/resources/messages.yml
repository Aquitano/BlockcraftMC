# Text for the Discord webhook in config.yml, plain: it never reaches a Minecraft chat.
alerts:
  no-lobby: "Auf <ip> ist keine Lobby mehr erreichbar! Online: <online> Spieler."
  lobby-back: "Auf <ip> ist wieder eine Lobby erreichbar. Online: <online> Spieler."
  lag: "<server> auf <ip> laggt: <mspt> ms pro Tick, <tps> TPS."
  lag-over: "<server> auf <ip> läuft wieder flüssig: <mspt> ms pro Tick, <tps> TPS."

# A first join (welcome in config.yml): everyone else on a server of welcome.groups sees announcement, the newcomer
# sees newcomer, and once the greeting window closes the newcomer hears who said hello, joined with the separators.
# og goes to an account the old network knew, the anniversary lines to a player on the day they first joined.
welcome:
  announcement:
    - "<prefix><accent><player> <muted>ist zum ersten Mal hier, als Spieler <primary>#<number><muted>!"
    - "<prefix><muted>Heiß <accent><player> <muted>in den nächsten <accent><seconds> Sekunden <muted>im Chat willkommen."
  newcomer:
    - "<prefix><muted>Hallo <accent><player><muted>, schön, dass du da bist! Du bist Spieler <primary>#<number><muted>."
    - "<prefix><muted>Die Lobby weiß schon Bescheid. Mal sehen, wer zuerst Hallo sagt."
  greeted: "<prefix><accent><greeters> <muted>heißen dich willkommen. Viel Spaß auf <ip>!"
  greeted-one: "<prefix><accent><greeters> <muted>heißt dich willkommen. Viel Spaß auf <ip>!"
  greeters:
    separator: "<muted>, "
    last-separator: "<muted> und "
    others: "<count> weitere"
  og:
    - "<prefix><muted>Du warst schon auf dem alten <ip> dabei. Dein Tag <dark>[<accent>OG<dark>] <muted>wartet in der Lobby in den Extras unter Chat-Tags."
    - "<prefix><muted>Danke, dass du zurück bist."
  anniversary: "<prefix><muted>Heute vor <accent><years> Jahren <muted>warst du zum ersten Mal auf <ip>. Danke, dass du dabei bist! Dein Kuchen-Gadget wartet in den Lobby-Extras."
  anniversary-one: "<prefix><muted>Heute vor <accent>einem Jahr <muted>warst du zum ersten Mal auf <ip>. Danke, dass du dabei bist! Dein Kuchen-Gadget wartet in den Lobby-Extras."
