prefix: "<gold>Blockcraft <dark_gray>» <reset>"

# The network's colours, the same tags the Paper plugins use (BlockcraftAPI messages.yml).
palette:
  primary: "<blue>"
  accent: "<yellow>"
  muted: "<gray>"
  dark: "<dark_gray>"
  success: "<green>"
  error: "<red>"
  bullet: "<dark_gray>● "
  arrow: "<dark_gray>» "
  quicksg: "<gold>"
  emeraldrush: "<green>"
  duell: "<aqua>"
player-only: "<error>Nur ein Spieler kann diesen Befehl verwenden!"
player-unknown: "<prefix><error>Der Spieler <gold><player> <error>ist unbekannt."
no-permission: "<prefix><error>Dazu hast du keine Berechtigung."
request-failed: "<prefix><error>Die Anfrage konnte nicht ausgeführt werden. Bitte melde das dem Team."
command-blocked: "<prefix><error>Nicht verfügbar!"
kicked-to-lobby: "<prefix><muted>Deine <error>Verbindung <muted>zum Server <error><server><muted> wurde getrennt. Grund: <error><reason>"
resource-pack:
  prompt: "<primary><ip> <muted>sieht mit unserem Texturenpaket am besten aus: <white>eigene Menüs und Symbole<muted>. Ohne geht es auch."
help:
  - "<bullet><primary>INFORMATIONEN ZUM SERVER <dark>●"
  - ""
  - "  <primary>/lobby <muted>- <white>Kehre in die Lobby zurück!"
  - "  <primary>/play <muted>- <white>Tritt einem Spiel bei!"
  - "  <primary>/report <muted>- <white>Reporte einen verdächtigen Spieler!"
  - "  <primary>/msg <muted>- <white>Sende einem Spieler eine private Nachricht!"
  - "  <primary>/party <muted>- <white>Erstelle eine Party!"
  - "  <primary>/premium /yt <muted>- <white>Erhalte Infos zu den Rängen!"
  - ""

duration:
  second: Sekunde
  seconds: Sekunden
  minute: Minute
  minutes: Minuten
  hour: Stunde
  hours: Stunden
  day: Tag
  days: Tage
  week: Woche
  weeks: Wochen
  month: Monat
  months: Monate
  year: Jahr
  years: Jahre
  remaining: "<time>"
  permanent: "<dark_red>Permanent"

login:
  maintenance:
    - "<prefix><muted>Du kannst <error><ip> <muted>derzeit nicht betreten."
    - " <muted>Derzeit sind <error>Wartungsarbeiten<muted>."
  full:
    - "<prefix><muted>Das maximale <error>Spielerlimit <muted>von <error><max> <muted>ist erreicht."
    - "<error>"
    - "<muted>Nur noch <error>Spieler <muted>mit dem <error>PremiumRang <muted>können noch <error>Joinen!"
    - "<muted>Discord: <error><discord>"
  error:
    - "<prefix><muted>Die Datenbank von <error><ip> <muted>ist derzeit nicht erreichbar."
    - " <muted>Bitte versuche es in ein paar Minuten erneut."
  welcome:
    - "<dark_aqua><strikethrough>-------------------------------------------"
    - ""
    - ""
    - "<prefix><accent><player><muted> ist neu auf <primary><ip><muted>! <dark_aqua>[#<number>]"
    - ""
    - ""
    - "<dark_aqua><strikethrough>-------------------------------------------"

tab:
  header:
    - "<muted>"
    - " <muted>» <success><ip> <dark>✘ <gold>Dein Netzwerk <muted>« "
    - " <gold>Derzeit spielen<success> <online>/<max> <gold>Spieler "
    - " <muted>"
  footer:
    - "<muted>"
    - " <success>Server <arrow><gold><server> <dark>"
    - " <success>Discord <arrow><gold><discord><dark> "
    - " <success>Forum <arrow><gold><website> "
    - "<muted>"

broadcast:
  teamspeak:
    - " "
    - "          <muted>Unsere <success>TeamSpeak<muted> IP:"
    - "               <success><teamspeak>"
    - " "
  youtuber:
    - " "
    - "          <muted>Interesse am <dark_purple>YouTuber <muted>Rang?"
    - "                  <success>/youtuber"
    - " "
  discord:
    - " "
    - "           <muted>Unser <success>Discord<muted>:"
    - "                  <success><discord>"
    - " "
  premium:
    - " "
    - "           <muted>Interesse an einem Rang (<gold>Premium<muted>)?"
    - "                   <muted>Besuche <success><shop>"
    - " "
  report:
    - " "
    - "           <muted>Du hast einen <error>Hacker <muted>gesehen?"
    - "                   <muted>Reporte ihn mit <aqua>/report \\<Spieler> \\<Grund>"
    - " "
  support:
    - " "
    - "          <muted>Du hast <error>Fragen <muted>oder <error>Probleme?"
    - "               <muted> Nutze <success>/support"
    - " "

motd:
  maintenance-version: "<error>Wartungsmodus <muted><online><dark>/<muted><max>"
  maintenance-line: "<muted>Der <error>Wartungsmodus<muted> ist derzeit aktiviert!"
  wrong-version: "<dark_red><bold>Falsche Version!"
  # Shown where the client would list who is online.
  sample:
    - "<accent><ip>"
    - "<muted>Online: <accent><online><dark>/<muted><max>"
    - ""
    - "<muted>Discord <dark>● <accent><discord>"
    - "<muted>Website <dark>● <accent><website>"
    - "<muted>Shop <dark>● <accent><shop>"
  usage:
    - "<prefix><error>/motd setdefault \\<motd>"
    - "<prefix><error>/motd add \\<motd>"
    - "<prefix><error>/motd del \\<zahl>"
    - "<prefix><error>/motd clear"
    - "<prefix><error>/motd list"
  del-usage: "<prefix><error>/motd del \\<zahl>"
  del-range: "<prefix><error>/motd del \\<zahl 1-<max>>"
  list-header: "<prefix><dark_aqua>----------<gold>Motds<dark_aqua>----------"
  list-default: "<prefix><primary>Default-Motd: <muted><motd>"
  list-empty: "<prefix>-"
  list-entry: "<prefix><number>: <muted><motd>"
  cleared: "<prefix><count> Random-Motds wurden erfolgreich gelöscht!"
  default-set: "<prefix><gold>Die Default-Motd wurde erfolgreich zu \"<muted><motd><gold>\" geändert!"
  added: "<prefix><gold>Die Motd \"<muted><motd><gold>\" wurde erfolgreich hinzugefügt!"
  removed: "<prefix><gold>Die Motd \"<muted><motd><gold>\" wurde erfolgreich gelöscht!"

setmax:
  current: "<prefix><muted>Es können maximal <aqua><max><muted> Spieler online!"
  done: "<prefix><muted>Die maximale <aqua>Spieleranzahl<muted> wurde zu <aqua><max><muted> gesetzt!"

moderation:
  self: "<prefix><error>Das kannst du nicht mit dir selbst machen."
  protected: "<prefix><error>Dieser Spieler steht im Rang über dir oder gleich mit dir."
  error: "<prefix><error>Die Strafe konnte nicht gespeichert werden. Bitte versuche es erneut."

ban:
  use-strafe: "<prefix><error>Nutze Folgendes: <dark_aqua>/strafe"
  notify:
    - "<dark_red><bold>Strafe <arrow><reset><error><player><muted> wurde vom <error>Netzwerk <muted>gesperrt."
    - "<dark_red><bold>Strafe <arrow><reset><muted>Grund: <error><reason>"
    - "<dark_red><bold>Strafe <arrow><reset><muted>Von: <error><issuer>"
    - "<dark_red><bold>Strafe <arrow><reset><muted>Länge: <error><remaining>"
  screen-temporary:
    - "<muted>Du wurdest vom <dark_aqua><ip> Netzwerk <muted>gebannt."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Verbleibende Zeit: <success>"
    - "<success><remaining>"
    - " "
    - " <muted>Unrechter Ban? Stelle einen <dark_aqua>Entbannungsantrag<muted> im Forum:"
    - " <dark_aqua><website>/Forum "
    - " <muted>oder auf dem TeamSpeak:"
    - " <dark_aqua><teamspeak>"
  screen-permanent:
    - "<muted>Du wurdest vom <dark_aqua><ip> Netzwerk <muted>gebannt."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Verbleibende Zeit: <success>"
    - "<success><remaining>"
    - " "
    - " <muted>Unrechter Ban? Stelle einen <dark_aqua>Entbannungsantrag<muted> im Forum:"
    - " <dark_aqua><website> "
    - " <muted>oder auf dem TeamSpeak:"
    - " <dark_aqua><teamspeak>"
unban:
  usage: "<prefix><muted>Ausführung:<error> /unban \\<Spieler>"
  not-banned: "<prefix><muted>Dieser <error>Spieler <muted>ist nicht gebannt."
  done: "<prefix><muted>Der <error>Spieler <muted>wurde entbannt."
  notify:
    - "<dark_red><bold>Strafe <arrow><reset><muted>Der Spieler <aqua><player> <muted>wurde von <error><issuer> <muted>entbannt."
tempban:
  usage: "<prefix><muted>Ausführung:<error> /tempban \\<Spieler> \\<Dauer> \\<Grund>"
  unbannable: "<prefix><dark_red>Du kannst diesen Spieler nicht bannen!"
  already-banned: "<prefix><muted>Dieser <error>Spieler <muted>ist bereits gebannt."
  units:
    - "<prefix><muted>Die Dauer ist ein Wort aus Zahl und Einheit, zum Beispiel <error>30m<muted>, <error>12h <muted>oder <error>16d<muted>."
    - "<prefix><muted>Einheiten: <error>s <muted>| <error>m <muted>| <error>h <muted>| <error>d <muted>| <error>w <muted>| <error>mon <muted>| <error>y"
  done: "<prefix><muted>Der Spieler <error><player><muted> wurde erfolgreich gebannt."

mute:
  use-strafe: "<prefix><muted>Nutze <error>/strafe \\<Name> \\<Grund>"
  notify:
    - "<prefix><muted>Der Spieler <error><player> <muted>wurde <muted>gemuted."
    - "<prefix><muted>Grund: <error><reason>"
    - "<prefix><muted>Von: <error><issuer>"
    - "<prefix><muted>Verbleibende Zeit: <error><remaining>"
  screen-temporary:
    - "<muted>Du wurdest vom <dark_aqua><ip> Netzwerk <muted>gemuted."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Verbleibende Zeit: <success>"
    - "<success><remaining>"
    - " "
    - " <muted>Unrechter Mute? Stelle einen <dark_aqua>Entmutungsantrag<muted> im Forum:"
    - " <dark_aqua><website>/Forum "
    - " <muted>oder auf dem TeamSpeak:"
    - " <dark_aqua><teamspeak>"
  screen-permanent:
    - "<muted>Du wurdest vom <dark_aqua><ip> Netzwerk <muted>gemuted."
    - " <muted>Grund: <success><reason> "
    - " "
    - " <muted>Verbleibende Zeit: <success>"
    - "<success><remaining>"
    - " "
    - " <muted>Unrechter Mute? Stelle einen <dark_aqua>Entmutungsantrag<muted> im Forum:"
    - " <dark_aqua><website> "
    - " <muted>oder auf dem TeamSpeak:"
    - " <dark_aqua><teamspeak>"
  check-failed: "<prefix><error>Deine Nachricht konnte gerade nicht geprüft werden. Versuche es gleich noch einmal."
unmute:
  usage: "<prefix><muted>Ausführung:<error> /unmute \\<Spieler>"
  not-muted: "<prefix><muted>Dieser <error>Spieler<muted> ist nicht gemuted."
  done: "<prefix><muted>Dieser <error>Spieler <muted>wurde erfolgreich entmuted."
  notify:
    - "<prefix>Der Spieler <error><player> <muted>wurde von <error><issuer> <muted>entmuted."
tempmute:
  usage: "<prefix><error>Ausführung: /tempmute \\<Spieler> \\<Dauer> \\<Grund>"
  already-muted: "<prefix><error>Dieser Spieler ist bereits gemuted."
  units:
    - "<prefix><muted>Die Dauer ist ein Wort aus Zahl und Einheit, zum Beispiel <error>30m<muted>, <error>12h <muted>oder <error>16d<muted>."
    - "<prefix><muted>Einheiten: <error>s <muted>| <error>m <muted>| <error>h <muted>| <error>d <muted>| <error>w <muted>| <error>mon <muted>| <error>y"
  done: "<prefix><muted>Du hast den Spieler <error><player><muted> erfolgreich gemuted."

banlist:
  empty: "<prefix><accent>Derzeit sind keine Spieler gebannt."
  header: "<prefix><gold>Folgende Spieler sind gebannt: "
  entry: "<prefix><error><player> <dark>| <muted>/check<error> <player>"
  count: "<prefix><gold>Gebannte Spieler: <dark_aqua><count>"
mutelist:
  empty: "<prefix><muted>Es sind derzeit keine <error>Spieler <muted>gemuted."
  header: "<prefix><muted>Diese <error>Spieler <muted>sind derzeit Gemuted:"
  entry: "<prefix><error><player> <dark>| <muted>/check <player>"

kick:
  usage: "<prefix><muted>Verwende <error>/kick \\<Spieler> \\<Grund>"
  offline: "<prefix><muted>Dieser <error>Spieler <muted>ist nicht online."
  done: "<prefix><muted>Du hast den <error>Spieler <muted>erfolgreich vom Netzwerk geworfen."
  notify:
    - "<prefix><error><player><muted> wurde von <error><issuer><muted> vom <dark_aqua><ip> Netzwerk <muted>gekickt."
    - "<prefix><muted>Grund: <success><reason>"
  screen:
    - "<muted>Du wurdest vom <dark_aqua><ip> Netzwerk <muted>gekickt. "
    - " <muted>Grund: <success><reason>"

check:
  usage: "<prefix><muted>Ausführung: <error>/check \\<Spieler>"
  banned:
    - "<prefix><dark_green><strikethrough>---------------------------------"
    - ""
    - "<prefix><accent>Spieler: <success><player>"
    - "<prefix><accent>Gebannt von: <dark_aqua><issuer>"
    - "<prefix><accent>Grund: <dark_aqua><reason>"
    - "<prefix><accent>Verbleibende Zeit: <dark_aqua><remaining>"
    - ""
  not-banned:
    - "<prefix><dark_green><strikethrough>---------------------------------"
    - ""
    - "<prefix><gold>Der Spieler ist nicht gebannt."
    - ""
  muted:
    - "<prefix><dark_aqua><strikethrough>---------------------------------"
    - ""
    - "<prefix><accent>Spieler: <success><player>"
    - "<prefix><accent>Gemuted von: <dark_aqua><issuer>"
    - "<prefix><accent>Grund: <dark_aqua><reason>"
    - "<prefix><accent>Verbleibende Zeit: <dark_aqua><remaining>"
    - ""
    - "<prefix><dark_green><strikethrough>---------------------------------"
  not-muted:
    - "<prefix><dark_aqua><strikethrough>---------------------------------"
    - ""
    - "<prefix><gold>Der Spieler ist nicht gemuted."
    - ""
    - "<prefix><dark_green><strikethrough>---------------------------------"
    - ""

history:
  usage: "<prefix><muted>Ausführung: <error>/history \\<Spieler>"
  header: "<prefix><gold>Strafen von <accent><player><muted>: <accent><bans> <muted>Bans <dark>| <accent><mutes> <muted>Mutes"
  empty: "<prefix><muted>Für <accent><player> <muted>ist keine Strafe gespeichert."
  entry: "<prefix><type> <dark>| <muted><date> <dark>| <accent><issuer> <dark>| <muted><reason> <dark>| <muted><duration><revoked>"
  revoked: " <dark>| <success>aufgehoben von <accent><revoker>"
  count: "<prefix><muted>Angezeigt: <accent><shown> <muted>von <accent><total><muted>."
  type-ban: "<error>Bann"
  type-mute: "<accent>Mute"
  # Java date pattern for the entries above; the German order belongs to the text, not to the code.
  date-format: "dd.MM.yyyy HH:mm"

strafe:
  unknown-number: "<dark_red><bold>Strafe <arrow><reset><error>Diese Nummer ist unbekannt."
  unbannable: "<dark_red><bold>Strafe <arrow><reset><error>Du kannst diesen Spieler nicht bannen!"
  overwrite: "<dark_red><bold>Strafe <arrow><reset><error>Dieser Spieler wurde bereits bestraft. Seine Strafe wird nun überschrieben..."
  done: "<dark_red><bold>Strafe <arrow><reset><success>Du hast den Spieler erfolgreich bestraft."
  list:
    - "<error><bold>Hack Strafen"
