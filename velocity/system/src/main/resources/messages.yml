    - " <muted><italic>Hacks <dark>| <error>KillAura : <aqua>2"
    - " <muted><italic>Hacks <dark>| <error>Fly : <aqua>3"
    - " <muted><italic>Hacks <dark>| <error>Autoclicker : <aqua>4"
    - " <muted><italic>Hacks <dark>| <error>Speed : <aqua>5"
    - " <muted><italic>Hacks <dark>| <error>Sonstiges : <aqua>6"
    - "<success><bold>Beleidigungs Strafen"
    - " <muted><italic>Beleidigungen <dark>| <error>Team : <aqua>7"
    - " <muted><italic>Beleidigungen <dark>| <error>Spieler : <aqua>8"
    - " <muted><italic>Beleidigungen <dark>| <error>Netzwerk : <aqua>9"
    - "<accent><bold>Sonstige Strafen"
    - " <muted><italic>Sonstiges <dark>| <error>Bugusing : <aqua>10"
    - " <muted><italic>Sonstiges <dark>| <error>Drohung : <aqua>11"
    - " <muted><italic>Sonstiges <dark>| <error>Radikalismus : <aqua>12"
    - " <muted><italic>Sonstiges <dark>| <error>Werbung : <aqua>13"
    - " <muted><italic>Sonstiges <dark>| <error>Combat-Log : <aqua>14"
    - "<dark_aqua><bold>Weitere Strafen"
    - " <muted><italic>Weiteres <dark>| <error>Teaming : <aqua>15"
    - " <muted><italic>Weiteres <dark>| <error>Leichte Beleidigung : <aqua>16"
    - " <muted><italic>Weiteres <dark>| <error>Respektloses Verhalten: <aqua>17"
    - " <muted><italic>Weiteres <dark>| <error>Report-Abuse: <aqua>18"
    - " <muted><italic>Weiteres <dark>| <error>Provokation-Beleidigung: <aqua>19"
    - " <muted><italic>Weiteres <dark>| <error>Provokation-Allgemein: <aqua>20"
    - " <muted><italic>Weiteres <dark>| <error>Alt-Account: <aqua>21"
    - " <muted><italic>Weiteres <dark>| <error>Banumgehung: <aqua>22"
    - " <muted><italic>Weiteres <dark>| <error>Griefing: <aqua>23"
    - " <muted><italic>Weiteres <dark>| <error>Extrem : <aqua>24"

strike:
  usage: "<prefix><error>Falsche Benutzung! <gold>Nutze: <dark_aqua>/strike [Spieler] [Grund]"
  offline: "<prefix><error>Der Spieler ist nicht online!"
  target-needs-permission: "<prefix><error>Du musst der Gruppe von <gold><player><error> die Permission geben: <gold><permission>"
  received: "<prefix><error>Du hast einen <gold><bold>Strike <reset><error>erhalten! <dark>[<aqua>#<count><dark>]"
  done: "<prefix><gold>Das Teammitglied <dark_red><player><gold> hat einen Strike erhalten!"
  max-reached: "<prefix><dark_aqua>Der Spieler <gold><player><dark_aqua> hat die maximale Anzahl an Strikes erreicht und wurde gebannt <dark_red>[#<count>]"
  ban-reason: "Strike-Überschreitung"
  ban-issuer: "StrikeSystem"
strikes:
  not-collected: "<prefix><error>Es werden keine Informationen über dich gesammelt..."
  header: "<prefix><dark_red>Die Strikes von <player>"
  count: "<prefix><accent>Strikes: <dark_red><count>"
  entry: "<prefix><accent>Grund<number>: <dark_red><reason> <muted>(<issuer>)"
  footer: "<prefix><dark_aqua><strikethrough>-----------------------------"
showstrikes:
  usage: "<prefix><error>Benutzung: <gold>/showstrikes [Spieler]"
delstrike:
  usage: "<prefix><error>Benutzung: <gold>/delstrike [Spieler]"
  none: "<prefix><error>Der Spieler hat keine Strikes!"
  done: "<prefix><dark_aqua>Dem Spieler <gold><player><dark_aqua> wurde ein Strike entzogen <dark_red>[#<number>]"
  received: "<prefix><dark_aqua>Dir wurde ein Strike entzogen! <dark_red>[#<number>]"
  remaining: "<prefix><muted>Verbleibende Strikes: <gold><remaining>"

warn:
  usage: "<prefix><error>/warn \\<player> [reason]"
  protected: "<prefix><muted>Du kannst diesen<error> Spieler<muted> nicht warnen."
  offline: "<prefix><muted>Der <error>Spieler<muted> wurde nicht gefunden oder ist offline! "
  offline-click: "<success>Hier klicken<error>, um \"<gold><player><error>\" trotzdem zu warnen."
  offline-hover: "<success><player> trotzdem warnen..."
  broadcast: "<dark_aqua>Der Spieler <error><bold>\"<player>\"<reset><dark_aqua> bekam einen <gold>Warn <dark_aqua>(<accent><count><dark_aqua>/<accent><max><dark_aqua>)."
  broadcast-reason: "<dark_aqua>Der Spieler <error><bold>\"<player>\"<reset><dark_aqua> bekam einen <gold>Warn <dark_aqua>(<accent><count><dark_aqua>/<accent><max><dark_aqua>). <error>Grund: <accent><reason>"
  you-have: "<prefix><gold>Du hast <error><count><gold>/<gold><max><error> Warns."
  kick-screen:
    - "<error>Du wurdest wegen <gold><count><error>/<error><max><gold> Warns vom Server geworfen."
  ban-hint:
    - ""
    - "<prefix><error>Der Spieler <gold><player><error> sollte jetzt, wegen"
    - "<prefix><error>zuvielen <accent>Warns<dark_red> gebannt <error>werden."
  ban-click: "<success>Hier klicken<error>, um eine Strafe für \"<gold><player><error>\" zu wählen."
  ban-hover: "<success>/strafe <player> öffnen..."
warns:
  usage: "<prefix><error>/warns \\<clear|get|list> [player]"
  clear-all-confirm: "<success>Hier klicken<error>, um das Zurücksetzen aller Warns zu bestätigen."
  clear-confirm: "<success>Hier klicken<error>, um das Zurücksetzen der Warns von \"<gold><player><error>\" zu bestätigen."
  clear-hover: "<success>Alle Warns zurücksetzen..."
  cleared-all: "<prefix><success>Alle Warns wurden erfolgreich resetet."
  cleared: "<prefix><success>Die <accent>Warns (<count> Warns) <success>von \"<gold><player><success>\", wurden erfolgreich resetet."
  get: "<prefix><success>Verwarnungen von <gold><player><success>: <accent><count><success>."
  too-many: "<prefix><error>Die Spieler können nicht angezeigt werden. Grund:<accent> Zu viele Spieler."
  list-header: "<dark_aqua>----------<gold>Verwarnungen (<count>)<dark_aqua>----------"
  list-entry: "<prefix><accent>  <player>: <error><count>"
werbung:
