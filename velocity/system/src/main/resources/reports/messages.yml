prefix: "<error>Reports <dark>» <reset>"

# The network's colours, the same tags the Paper plugins use (BlockcraftAPI messages.yml).
palette:
  primary: "<blue>"
  accent: "<yellow>"
  muted: "<gray>"
  dark: "<dark_gray>"
  success: "<green>"
  error: "<red>"
  bullet: "<dark_gray>● "
  arrow: "<dark_gray>» "
player-only: "<error>Du musst ein Spieler sein!"
usage: "<prefix>Nutze <error>/report [Spieler]"
no-permission: "<prefix>Du hast nicht genügend Rechte!"
info:
  - "<muted><strikethrough>----------------</strikethrough><error> Reports <muted><strikethrough>----------------"
  - "<muted>Prefix: <accent><prefix>Test Message"
  - "<muted>Autor: <accent><author>"
  - "<muted>Version: <accent><version>"
  - "<muted>Befehl: <accent>/report [Spieler]"
  - "<muted><strikethrough>----------------</strikethrough><error> Reports <muted><strikethrough>----------------"
notify:
  status-on: "<prefix>Notifies: <success>ON"
  status-off: "<prefix>Notifies: <error>OFF"
  disabled: "<prefix>Du erhältst nun keine Report Notifies! (Notifies: <error>OFF<reset>)"
  already-disabled: "<prefix>Du erhältst bereits keine Report Notifies! (Notifies: <error>OFF<reset>)"
  enabled: "<prefix>Du erhältst nun wieder Report Notifies! (Notifies: <success>ON<reset>)"
  already-enabled: "<prefix>Du erhältst bereits Report Notifies! (Notifies: <success>ON<reset>)"
  usage: "<prefix>Um die Notifies an oder aus zu schalten <error>/report notify [on|off]"
  failed: "<prefix><error>Die Einstellung konnte nicht gespeichert werden. Bitte versuche es erneut."
report:
  unknown-player: "<prefix><error>Dieser Spieler ist nicht bekannt oder nicht sichtbar."
  self: "<prefix>Du kannst dich nicht selber reporten!"
  exists: "<prefix>Du hast diesen Spieler bereits gemeldet!"
  invalid-player: "<prefix>Das ist kein gültiger Spielername!"
  reason-too-long: "<prefix>Dein Grund darf höchstens <error><bold><max> <reset><muted>Zeichen lang sein!"
  error: "<prefix>Dein Report konnte nicht gespeichert werden, bitte versuche es später erneut!"
  cooldown: "<prefix>Du kannst diesen Befehl erst wieder in <error><bold><seconds> <reset><muted>Sekunden nutzen!"
  success: "<prefix><muted>Du hast den Spieler <error><bold><player><reset><muted> erfolgreich gemeldet!"
  offline-server: "Offline"
staff:
  notice: "<prefix><accent><bold><reporter> <reset><muted>hat <target><muted> gemeldet!"
  target: "<error><bold><reported>"
  goto-command: "/goto <reported>"
  hover:
    - "<error><bold><reported>"
    - ""
    - "<muted>Reporter: <accent><reporter>"
    - "<muted>Grund: <accent><reason>"
    - "<muted>Server: <accent><server>"
  hover-goto:
    - ""
    - "<muted>Klicke, um zu <accent><reported><muted> zu springen."
  reason: "<prefix><muted>Grund: <accent><reason>"
  count: "<prefix><muted>Bereits <accent><count> <muted>Reports gegen <error><reported><muted>."
