database:
  host: localhost
  port: 3306
  database: blockcraft
  username: blockcraft
  password: blockcraft

network:
  ip: BlockcraftMC.net
  website: https://BlockcraftMC.net
  shop: https://shop.BlockcraftMC.net
  teamspeak: ts.BlockcraftMC.net
  discord: https://discord.gg/kh3xaQ3

lobby-server: lobby

# Edited in-game by /setmax and /motd; MOTD lines use legacy & colour codes.
max-players: 100
motd:
  default: "&cBlockcraft.net"
  random: []

max-warns: 8
max-strikes: 5
auto-broadcast-minutes: 5

joinme:
  daily-limit: 6
  reset-hour: 0

# Server name prefix -> messages.yml key joinme.game.<value>
joinme-games:
  KFFA: knockbackffa
  1vs1: pvp
  NoHitDelay: pvp
  SoupPvP: pvp
  BW: bedwars
  SW: skywars
  EM: tradewars
  BauServer: bauserver

unbannable:
  - Aquitano

# Command names (without the slash) players need blockcraft.system.blockedcommands.bypass to run.
blocked-commands:
  - plugins
  - demote
  - promote
  - "permissionsex:"
  - pex
  - pl
  - "?"
  - bungee
  - me
  - "bukkit:plugins"
  - "bukkit:pl"
  - "bukkit:?"
  - "bukkit:help"
  - "bukkit:me"
  - version
  - tell
  - "minecraft:me"

