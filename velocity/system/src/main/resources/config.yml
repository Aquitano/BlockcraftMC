database:
  host: localhost
  port: 3306
  database: blockcraft
  username: blockcraft
  password: blockcraft

network:
  ip: BlockcraftMC.net
  website: https://BlockcraftMC.net
  shop: https://shop.BlockcraftMC.net
  teamspeak: ts.BlockcraftMC.net
  discord: https://discord.gg/kh3xaQ3

# Server group players land in; game groups are joined with /play <group>.
lobby-group: lobby

# Backends announce themselves in bc_servers; the proxy registers them and drops any whose heartbeat is stale.
discovery:
  poll-seconds: 5
  stale-seconds: 20

# Discord webhook that is told when no lobby is joinable any more and when one is back; empty disables it.
alerts:
  webhook-url: ""
  min-interval-seconds: 300

# Edited in-game by /setmax and /motd; MOTD lines use legacy & colour codes.
max-players: 100
motd:
  default: "&cBlockcraftMC.net"
  random: []

max-warns: 8
max-strikes: 5
auto-broadcast-minutes: 5

# How often the tab list header and footer are rewritten, so the player count there does not go stale.
tab:
  refresh-seconds: 5

# How long a code from /discord link stays valid; the invite itself is network.discord.
discord-code-minutes: 10

joinme:
  daily-limit: 6
  reset-hour: 0

# Friends (bc_friends): how many a player may have and how long an unanswered request stays valid.
friends:
  max: 50
  request-minutes: 10

unbannable:
  - Aquitano

# Command names (without the slash) players need blockcraft.system.blockedcommands.bypass to run.
blocked-commands:
  - plugins
  - demote
  - promote
  - "permissionsex:"
  - pex
  - pl
  - "?"
  - bungee
  - me
  - "bukkit:plugins"
  - "bukkit:pl"
  - "bukkit:?"
  - "bukkit:help"
  - "bukkit:me"
  - version
  - tell
  - "minecraft:me"

# /strafe catalogue. duration: <n>s|m|h|d|w|mon|y or permanent.
