# The whole dev network: MariaDB, the Velocity proxy and one Paper server per game mode. Plugin jars come from
# `./gradlew stagePlugins`; each Paper service lists the plugin directories it runs in COPY_PLUGINS_SRC. The servers
# find each other through the database (README, "Run locally"). Each server's map comes from worlds/<group>
# (README, "Maps"): the world is copied fresh from there at every start and /map save writes it back.

x-luckperms: &luckperms
  LUCKPERMS_STORAGE_METHOD: mariadb
  LUCKPERMS_DATA_ADDRESS: mariadb:3306
  LUCKPERMS_DATA_DATABASE: blockcraft
  LUCKPERMS_DATA_USERNAME: blockcraft
  LUCKPERMS_DATA_PASSWORD: blockcraft
  LUCKPERMS_MESSAGING_SERVICE: sql

# Game servers restart themselves after a round (Bukkit.shutdown), so the container has to come back on its own.
x-paper: &paper
  image: itzg/minecraft-server:2026.10.0-java25
  restart: unless-stopped
  stop_grace_period: 1m
  depends_on:
    mariadb:
      condition: service_healthy

x-paper-env: &paper-env
  <<: *luckperms
  EULA: "TRUE"
  TYPE: PAPER
  VERSION: "26.3"
  PAPER_BUILD: "206"
  TZ: Europe/Berlin
  ONLINE_MODE: "FALSE"
  NETWORK_COMPRESSION_THRESHOLD: "-1"
  MAX_PLAYERS: "200"
  SPAWN_PROTECTION: "0"
  ALLOW_FLIGHT: "TRUE"
  LEVEL_TYPE: minecraft:flat
  GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
  MEMORY: 1G
  SYNC_SKIP_NEWER_IN_DESTINATION: "false"
  CREATE_CONSOLE_IN_PIPE: "true"
  # ViaVersion lets clients newer than the server join (README, "Client versions").
  PLUGINS: |
    https://download.luckperms.net/1669/bukkit/loader/LuckPerms-Bukkit-5.5.82.jar
    https://github.com/ViaVersion/ViaVersion/releases/download/5.12.1/ViaVersion-5.12.1.jar
  BLOCKCRAFT_DB_HOST: mariadb

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      MARIADB_DATABASE: blockcraft
      MARIADB_USER: blockcraft
      MARIADB_PASSWORD: blockcraft
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  velocity:
    image: itzg/mc-proxy:2026.10.1-java25
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "25565:25565"
      - "8080:8080"
    environment:
      <<: *luckperms
      TYPE: VELOCITY
      VELOCITY_VERSION: "4.2.0"
      VELOCITY_BUILD_ID: "30"
      TZ: Europe/Berlin
      MEMORY: 512m
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      BLOCKCRAFT_DB_HOST: mariadb
      PLUGINS: https://download.luckperms.net/1669/velocity/LuckPerms-Velocity-5.5.82.jar
    volumes:
      - ./build/docker/velocity:/plugins:ro
      - ./dev/velocity/velocity.toml:/config/velocity.toml:ro
      - ./dev/velocity/forwarding.secret:/config/forwarding.secret:ro
      - velocity:/server

  lobby:
    <<: *paper
    hostname: lobby
    environment:
      <<: *paper-env
      BLOCKCRAFT_SERVER_GROUP: lobby
      BLOCKCRAFT_WORLD_TEMPLATE: /worlds/lobby
      COPY_PLUGINS_SRC: /blockcraft/luckperms,/blockcraft/api,/blockcraft/core,/blockcraft/lobby,/blockcraft/statussigns,/blockcraft/reports
    volumes:
      - ./build/docker/paper:/blockcraft:ro
      - ./dev/paper/config/paper-global.yml:/config/paper-global.yml:ro
      - ./worlds/lobby:/worlds/lobby
      - lobby:/data

  duell:
    <<: *paper
    hostname: duell
    environment:
      <<: *paper-env
      BLOCKCRAFT_SERVER_GROUP: duell
      BLOCKCRAFT_WORLD_TEMPLATE: /worlds/duell
      COPY_PLUGINS_SRC: /blockcraft/luckperms,/blockcraft/api,/blockcraft/core,/blockcraft/duell
    volumes:
      - ./build/docker/paper:/blockcraft:ro
      - ./dev/paper/config/paper-global.yml:/config/paper-global.yml:ro
      - ./worlds/duell:/worlds/duell
      - duell:/data

  emeraldrush:
    <<: *paper
    hostname: emeraldrush
    environment:
      <<: *paper-env
      BLOCKCRAFT_SERVER_GROUP: emeraldrush
      BLOCKCRAFT_WORLD_TEMPLATE: /worlds/emeraldrush
      COPY_PLUGINS_SRC: /blockcraft/luckperms,/blockcraft/api,/blockcraft/core,/blockcraft/emeraldrush
    volumes:
      - ./build/docker/paper:/blockcraft:ro
      - ./dev/paper/config/paper-global.yml:/config/paper-global.yml:ro
      - ./worlds/emeraldrush:/worlds/emeraldrush
      - emeraldrush:/data

  bedwars:
    <<: *paper
    hostname: bedwars
    environment:
      <<: *paper-env
      BLOCKCRAFT_SERVER_GROUP: bedwars
      BLOCKCRAFT_WORLD_TEMPLATE: /worlds/bedwars
      COPY_PLUGINS_SRC: /blockcraft/luckperms,/blockcraft/api,/blockcraft/core,/blockcraft/bedwars
    volumes:
      - ./build/docker/paper:/blockcraft:ro
      - ./dev/paper/config/paper-global.yml:/config/paper-global.yml:ro
      - ./worlds/bedwars:/worlds/bedwars
      - bedwars:/data

  mlgrush:
    <<: *paper
    hostname: mlgrush
    environment:
      <<: *paper-env
      BLOCKCRAFT_SERVER_GROUP: mlgrush
      BLOCKCRAFT_WORLD_TEMPLATE: ""
      COPY_PLUGINS_SRC: /blockcraft/luckperms,/blockcraft/api,/blockcraft/core,/blockcraft/mlgrush
    volumes:
      - ./build/docker/paper:/blockcraft:ro
      - ./dev/paper/config/paper-global.yml:/config/paper-global.yml:ro
      - mlgrush:/data

  zombies:
    <<: *paper
    hostname: zombies
    environment:
      <<: *paper-env
      BLOCKCRAFT_SERVER_GROUP: zombies
      BLOCKCRAFT_WORLD_TEMPLATE: /worlds/zombies
      COPY_PLUGINS_SRC: /blockcraft/luckperms,/blockcraft/api,/blockcraft/core,/blockcraft/zombies
    volumes:
      - ./build/docker/paper:/blockcraft:ro
      - ./dev/paper/config/paper-global.yml:/config/paper-global.yml:ro
      - ./worlds/zombies:/worlds/zombies
      - zombies:/data

  quicksg:
    <<: *paper
    hostname: quicksg
    environment:
      <<: *paper-env
      BLOCKCRAFT_SERVER_GROUP: quicksg
      BLOCKCRAFT_WORLD_TEMPLATE: /worlds/quicksg
      COPY_PLUGINS_SRC: /blockcraft/luckperms,/blockcraft/api,/blockcraft/core,/blockcraft/quicksg
    volumes:
      - ./build/docker/paper:/blockcraft:ro
      - ./dev/paper/config/paper-global.yml:/config/paper-global.yml:ro
      - ./worlds/quicksg:/worlds/quicksg
      - quicksg:/data

volumes:
  mariadb:
  velocity:
  lobby:
  duell:
  emeraldrush:
  quicksg:
  bedwars:
  mlgrush:
  zombies:
